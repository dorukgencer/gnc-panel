name: Sektor F/K degerleme hesapla (haftalik)

on:
  schedule:
    - cron: "30 5 * * 1"  # Pazartesi 05:30 UTC - rotasyon hesabindan hemen sonra
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: veri-degerleme
  cancel-in-progress: false

jobs:
  hesapla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: F/K hesapla (yeni veri cekmez, mevcut finansal+fiyat verisinden)
        run: python deger_hesapla.py
      - name: Kaydet
        run: |
          git config user.name "gnc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gnc-panel/degerleme_gecmis.json
          git commit -m "Sektor F/K degerlemesi guncellendi" || { echo "Degisiklik yok"; exit 0; }
          git pull --rebase --autostash origin main
          git push
