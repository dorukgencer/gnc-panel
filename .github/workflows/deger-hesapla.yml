name: Sektor F/K degerleme hesapla + gunluk arsiv

on:
  schedule:
    # Hafta ici her gun 15:30 UTC (18:30 TR) - borsa kapanisindan (18:00 TR)
    # 30 dk sonra, piyasa_cek.py'nin son calismasi kesinlesmis olur.
    # ONCEDEN sadece Pazartesi (haftalik) calisiyordu - ama F/K, GUNLUK degisen
    # fiyata bagli oldugu icin gunluk arsiv (5 gun geriye gitme ozelligi)
    # anlamli olsun diye artik hafta ici her gun calisiyor.
    - cron: "30 15 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: veri-degerleme
  cancel-in-progress: false

jobs:
  hesapla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: F/K hesapla (yeni veri cekmez, mevcut finansal+fiyat verisinden)
        run: python deger_hesapla.py
      - name: Bugunun Endekse Katki + Degerleme durumunu arsivle (5 gun geriye gitme ozelligi icin)
        run: python gunluk_arsiv.py
      - name: Kaydet
        run: |
          git config user.name "gnc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gnc-panel/degerleme_gecmis.json gnc-panel/gunluk_arsiv.json
          git commit -m "Sektor F/K degerlemesi ve gunluk arsiv guncellendi" || { echo "Degisiklik yok"; exit 0; }
          git pull --rebase --autostash origin main
          git push
