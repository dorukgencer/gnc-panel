name: HAO_PD kolon teshisi (tek seferlik, elle calistir)

on:
  workflow_dispatch: {}

jobs:
  teshis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kutuphaneleri yukle
        run: pip install isyatirimhisse pandas
      - name: Sutunlari teshis et
        run: python teshis_hao_pd.py
