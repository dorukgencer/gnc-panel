name: Hisse fiyat gecmisi guncelle

on:
  schedule:
    # Her gun 16:15 UTC (19:15 TR) - piyasa kapanisindan sonra, finansal
    # tablo cekiminden (16:30 UTC) hemen once. Gunluk seri oldugu icin
    # gun ici sik calismaya gerek yok.
    - cron: "15 16 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: veri-gecmis
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kutuphaneleri yukle
        run: pip install isyatirimhisse pandas
      - name: Fiyat gecmisini cek
        run: python hisse_gecmis_cek.py
      - name: Kaydet
        run: |
          git config user.name "gnc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gnc-panel/hisse_gecmis
          git commit -m "Hisse fiyat gecmisi guncellendi" || { echo "Degisiklik yok"; exit 0; }
          git pull --rebase --autostash origin main
          git push
