name: Hisse finansal TAM YENILEME (aylik)

on:
  schedule:
    # Ayda BIR KEZ (her ayin 1'i, 02:00 UTC - trafigin en dusuk oldugu saat).
    # Neden gerekli: TMS 29 (enflasyon muhasebesi) GECMIS donemleri de
    # yeniden ifade edebiliyor - artimli mod sadece yeni ceyrekleri ceker,
    # gecmisteki bir duzeltmeyi kacirir. Ayda bir tam tarama bunu yakalar.
    - cron: "0 2 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: veri-hisse-finansal
  cancel-in-progress: false

jobs:
  tam_yenile:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # ~3 saat (paralel cekimle ~1-1.5 saat bekleniyor, pay birakildi)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kutuphaneleri yukle
        run: pip install isyatirimhisse pandas
      - name: TAM finansal tarama (tum gecmis)
        env:
          TAM_YENILEME: "1"
        run: python hisse_finansal_cek.py
      - name: Buyume hesapla
        run: python buyume_hesapla.py
      - name: Kaydet
        run: |
          git config user.name "gnc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gnc-panel/finansal/ gnc-panel/buyume_gecmis.json
          git commit -m "Hisse finansal TAM YENILEME (aylik)" || { echo "Degisiklik yok"; exit 0; }
          # CAKISMA COZUMU (16 Agu 2026): Tam yenileme SAATLER suruyor; o pencerede
          # artimli workflow da ayni dosyalari yazip push edebiliyor ve duz rebase
          # 472 dosyada cakisiyordu. Tam yenileme TUM veriyi bastan, TEK vintage ile
          # urettigi icin OTORITE kabul edilir -> cakismada BIZIM surum kazanir.
          # NOT: rebase'de "theirs" = replay edilen (bizim) commit'tir, "ours" =
          # uzerine alinan dal. Bu ters gibi gorunur ama git'in tanimi boyledir.
          basarili=0
          for deneme in 1 2 3; do
            git fetch origin main
            if git rebase -X theirs origin/main; then
              if git push; then basarili=1; break; fi
            fi
            git rebase --abort 2>/dev/null || true
            echo "Deneme $deneme basarisiz, 15sn sonra tekrar..."
            sleep 15
          done
          [ "$basarili" = "1" ] || { echo "3 denemede de push edilemedi"; exit 1; }
