name: Gunluk veri (makro + reel getiri + takvim + kripto)

# BIRLESTIRME NOTU
# Eskiden bunlar 4 ayri is akisiydi: makro-guncelle, reel-getiri,
# turkiye-guncelle, kripto-global. Her biri kendi checkout + Python kurulum
# maliyetini odiyordu (~1 dk sabit gider x 142 calisma/ay = ~142 dk bosa).
# Hepsi ayni veriyi cekmiyor ama hepsi HIZLI ve gunde bir yeter.
# Tek is akisinda birlesince sabit gider bir kez odenir.
# Bir adim hata verirse digerleri devam eder (continue-on-error).

on:
  schedule:
    - cron: "15 7 * * *"    # her gun 10:15 TR
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: veri-gunluk
  cancel-in-progress: false

jobs:
  gunluk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/py

      - name: Makro rejim (DXY, US10Y, TR10Y, TUFE)
        continue-on-error: true
        run: python makro_cek.py
      - name: Reel getiri deflatoru + TCMB faiz
        continue-on-error: true
        run: python reel_getiri_cek.py
      - name: Turkiye ekonomik takvim
        continue-on-error: true
        run: python turkiye_cek.py
      - name: Kripto global metrikler
        continue-on-error: true
        run: python kripto_global_cek.py

      - name: Kaydet
        run: |
          git config user.name "gnc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gnc-panel/*.json
          git commit -m "Gunluk veri guncellendi (makro + reel + takvim + kripto)" \
            || { echo "Degisiklik yok"; exit 0; }
          for d in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep 10
          done
          exit 1

      - name: Hata bildir
        if: failure()
        uses: ./.github/actions/hata-bildir
        with:
          isim: "Gunluk veri"
