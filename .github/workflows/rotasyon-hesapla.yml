name: Sektor rotasyonu hesapla (haftalik)

on:
  schedule:
    # Her Pazartesi 05:00 UTC (08:00 TR) - haftalik "donem" mantigina uygun
    - cron: "0 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: veri-rotasyon
  cancel-in-progress: false

jobs:
  hesapla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rotasyonu hesapla (yeni veri cekmez, endeks_gecmis'ten)
        run: python rotasyon_hesapla.py
      - name: Kaydet
        run: |
          git config user.name "gnc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gnc-panel/rotasyon_gecmis.json
          git commit -m "Sektor rotasyonu guncellendi" || { echo "Degisiklik yok"; exit 0; }
          git pull --rebase --autostash origin main
          git push
