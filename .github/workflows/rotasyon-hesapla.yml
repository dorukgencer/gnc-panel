name: Sektor rotasyonu hesapla (haftalik)

on:
  schedule:
    # Her Pazartesi 05:00 UTC (08:00 TR) - haftalik "donem" mantigina uygun
    - cron: "0 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: veri-rotasyon
  cancel-in-progress: false

jobs:
  hesapla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rotasyonu hesapla (yeni veri cekmez, endeks_gecmis'ten)
        run: python rotasyon_hesapla.py
      - name: Evre degisimlerini takip et (Degisim Gunlugu icin)
        run: python rotasyon_degisim_takip.py
      - name: Kaydirma cubugu icin gecmis zaman serisini hesapla
        run: python rotasyon_zaman_serisi_hesapla.py
      # KALDIRILDI: rotasyon_turetilmis_hesapla.py buradan cikarildi.
      # deger-hesapla.yml zaten HAFTA ICI HER GUN (Pazartesi dahil) 15:30 UTC'de
      # bu script'i CALISTIRIYOR - o gunun GERCEK kapanis fiyatiyla. Burada
      # sabah 05:00'te calistirmak, ayni gun 15:30'daki tarafindan uzerine
      # yazilan, tamamen bosa giden bir calisma idi (100% redundant).
      - name: Kaydet
        run: |
          git config user.name "gnc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gnc-panel/rotasyon_gecmis.json gnc-panel/rotasyon_onceki_hafta.json gnc-panel/rotasyon_zaman_serisi.json
          if [ -f gnc-panel/rotasyon_degisim_log.json ]; then
            git add gnc-panel/rotasyon_degisim_log.json
          fi
          git commit -m "Sektor rotasyonu, degisim gunlugu ve zaman serisi guncellendi" || { echo "Degisiklik yok"; exit 0; }
          git pull --rebase --autostash origin main
          git push
