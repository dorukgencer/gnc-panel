name: Sektor-hisse eslemesi guncelle

on:
  schedule:
    # Ayin 1'inde 05:00 UTC (uyeler ceyrekte bir degisir, ayda bir yeter)
    - cron: "0 5 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kutuphaneleri yukle
        run: pip install borsapy pandas
      - name: Eslemeyi cek
        run: python sektor_hisseler_cek.py
      - name: Kaydet
        run: |
          git config user.name "gnc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gnc-panel/sektor_hisseler.json
          git commit -m "Sektor-hisse eslemesi guncellendi" || echo "Degisiklik yok"
          git push
