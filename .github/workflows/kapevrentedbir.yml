name: KAP evren + VBTS tedbir (gunluk)

# NEDEN VAR
# Iki veri, sistemin iki buyuk acigini kapatir:
#   1. kap_evren_cek.py  -> borsadan cikmis sirketler (hayatta kalma yanliligi)
#   2. kap_tedbir_cek.py -> VBTS tedbir kayitlari (risk katmaninin eksik filtresi)
# Ikisi de KAP'tan ucretsiz gelir. Gunluk calisir; tedbir kararlari seans
# kapanisindan SONRA ilan edildigi icin aksam calistirilir.

on:
  schedule:
    - cron: "0 17 * * 1-5"     # 20:00 TR - tedbir kararlari ilan edildikten sonra
  workflow_dispatch:
    inputs:
      tam_tedbir_dolumu:
        description: "VBTS arsivini 2021'den bugune BASTAN cek (UZUN SURER, tek seferlik)"
        required: false
        default: "hayir"
        type: choice
        options: ["hayir", "evet"]
      cikan_fiyat_dolumu:
        description: "Borsadan cikmis sirketlerin fiyat gecmisini cek (tek seferlik)"
        required: false
        default: "hayir"
        type: choice
        options: ["hayir", "evet"]

permissions:
  contents: write
  issues: write

concurrency:
  group: veri-kap
  cancel-in-progress: false

jobs:
  kap:
    runs-on: ubuntu-latest
    timeout-minutes: 180        # tam dolum saatler surebilir
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/py

      # NOT: Bu is DEVAM EDEBILIR. Zaman asimina ugrarsa ayni is akisini
      # tekrar calistirmak yeterli - tamamlanmis pencereler ve cekilmis
      # kodlar atlanir, kaldigi yerden devam eder.
      - name: KAP evren (aktif / islem gormeyen / pasif)
        continue-on-error: true
        run: |
          if [ "${{ github.event.inputs.cikan_fiyat_dolumu }}" = "evet" ]; then
            python kap_evren_cek.py --doldur
          else
            python kap_evren_cek.py
          fi

      - name: VBTS tedbir kayitlari
        continue-on-error: true
        run: |
          if [ "${{ github.event.inputs.tam_tedbir_dolumu }}" = "evet" ]; then
            python kap_tedbir_cek.py --bas 2021-01-01
          else
            python kap_tedbir_cek.py --gunluk
          fi

      - name: Tarama ve gecmis testi yeni veriyle yenile
        continue-on-error: true
        run: |
          python tarama_hesapla.py
          python gecmis_test.py

      - name: Kaydet
        run: |
          git config user.name "gnc-bot"
          git config user.email "actions@users.noreply.github.com"
          # HATA (29 Agu 2026): "git add a b c" yollardan BIRI yoksa HICBIRINI
          # eklemez (fatal: pathspec did not match). Ilk calistirmada
          # tedbir_ara/ ve hisse_gecmis_cikan/ henuz yoktu; cekilen 1115
          # sirketlik veri sessizce kayboldu, is yesil bitti.
          # Artik her yol TEK TEK ve varligi kontrol edilerek eklenir.
          for y in gnc-panel/kap_evren.json gnc-panel/kap_cikanlar.json \
                   gnc-panel/kap_evren_gecmis gnc-panel/tedbir.json \
                   gnc-panel/tedbir_ara gnc-panel/tarama.json \
                   gnc-panel/gecmis_test.json gnc-panel/hisse_gecmis_cikan; do
            if [ -e "$y" ]; then
              git add "$y" && echo "eklendi : $y"
            else
              echo "yok     : $y (atlandi)"
            fi
          done
          if git diff --cached --quiet; then
            echo "::warning::Hicbir dosya degismedi. Ustteki adimlarin ciktisina bak."
            exit 0
          fi
          echo "--- commit edilecekler ---"
          git diff --cached --name-only
          git commit -m "KAP evren + VBTS tedbir guncellendi"
          for d in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep 10
          done
          exit 1

      - name: Hata bildir
        if: failure()
        uses: ./.github/actions/hata-bildir
        with:
          isim: "KAP evren + VBTS tedbir"
