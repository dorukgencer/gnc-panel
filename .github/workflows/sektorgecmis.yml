name: BIST sektor gecmis (rotasyon verisi)

on:
  schedule:
    # Ayin 1'inde 16:00 UTC (rotasyon verisi yavas degisir, ayda bir yeter)
    - cron: "0 16 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: veri-sektor-gecmis
  cancel-in-progress: false

jobs:
  gecmis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/py
      - name: Gecmis veriyi cek
        run: python sektor_gecmis_cek.py
      - name: Kaydet
        run: |
          git config user.name "gnc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gnc-panel/sektor_gecmis.json
          git commit -m "Sektor gecmis verisi guncellendi" || { echo "Degisiklik yok"; exit 0; }
          git pull --rebase --autostash origin main
          git push

      - name: Hata bildir
        if: failure()
        uses: ./.github/actions/hata-bildir
        with:
          isim: "sektor-gecmis"
