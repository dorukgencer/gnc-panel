name: Makro rejim verisi guncelle (DXY, US10Y, TR10Y, TUFE)

on:
  schedule:
    # Her gun 07:15 UTC (10:15 TR) - deflator isinden hemen sonra.
    - cron: "15 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: veri-makro
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kutuphaneleri yukle
        run: pip install requests
      - name: Makro verileri cek
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python makro_cek.py
      - name: Kaydet
        run: |
          git config user.name "gnc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gnc-panel/makro_gecmis.json
          git commit -m "Makro rejim verisi guncellendi" || { echo "Degisiklik yok"; exit 0; }
          git pull --rebase --autostash origin main
          git push
