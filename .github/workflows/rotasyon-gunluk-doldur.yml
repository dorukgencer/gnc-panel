name: Rotasyon degisim gunlugu GECMIS doldur (tek seferlik)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  doldur:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gecmis gecisleri hesapla ve gunluge yaz
        run: python rotasyon_gunluk_doldur.py
      - name: Kaydet
        run: |
          git config user.name "gnc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gnc-panel/rotasyon_degisim_log.json gnc-panel/rotasyon_onceki_hafta.json
          git commit -m "Rotasyon degisim gunlugu gecmise donuk dolduruldu" || { echo "Degisiklik yok"; exit 0; }
          git pull --rebase --autostash origin main
          git push
