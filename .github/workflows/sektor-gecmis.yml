name: BIST sektor gecmis (rotasyon verisi)

on:
  schedule:
    # Ayin 1'inde 16:00 UTC (rotasyon verisi yavas degisir, ayda bir yeter)
    - cron: "0 16 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  gecmis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kutuphaneleri yukle
        run: pip install isyatirimhisse pandas
      - name: Gecmis veriyi cek
        run: python sektor_gecmis_cek.py
      - name: Kaydet
        run: |
          git config user.name "gnc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gnc-panel/sektor_gecmis.json
          git commit -m "Sektor gecmis verisi guncellendi" || echo "Degisiklik yok"
          git push
