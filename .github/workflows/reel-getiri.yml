name: Reel getiri deflatoru + TCMB faiz guncelle

on:
  schedule:
    # Her gun 07:00 UTC (10:00 TR). TUFE ayin 3'unde cikar; gunluk calismak
    # USD serisini de guncel tutar (git yalnizca degisen dosyayi commit'ler).
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: veri-deflator
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kutuphaneleri yukle
        run: pip install borsapy pandas
      - name: Deflatoru ve faiz gecmisini cek
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: python reel_getiri_cek.py
      - name: Kaydet
        run: |
          git config user.name "gnc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gnc-panel/deflator.json gnc-panel/faiz_gecmis.json
          git commit -m "Reel getiri deflatoru ve TCMB faiz gecmisi guncellendi" || { echo "Degisiklik yok"; exit 0; }
          git pull --rebase --autostash origin main
          git push
