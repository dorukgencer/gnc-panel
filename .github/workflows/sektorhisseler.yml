name: Sektor-hisse eslemesi guncelle

on:
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: veri-esleme
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/py
      - name: Eslemeyi cek
        run: python sektor_hisseler_cek.py
      - name: Kaydet
        run: |
          git config user.name "gnc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gnc-panel/sektor_hisseler.json
          git commit -m "Sektor-hisse eslemesi guncellendi" || { echo "Degisiklik yok"; exit 0; }
          git pull --rebase --autostash origin main
          git push

      - name: Hata bildir
        if: failure()
        uses: ./.github/actions/hata-bildir
        with:
          isim: "sektor-hisseler"
