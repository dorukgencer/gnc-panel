name: Endeks gunluk fiyat gecmisi guncelle

on:
  schedule:
    # Her gun 16:20 UTC - hisse fiyat gecmisinden hemen sonra.
    - cron: "20 16 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: veri-endeks-gecmis
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kutuphaneleri yukle
        run: pip install isyatirimhisse pandas
      - name: Endeks gecmisini cek
        run: python endeks_gecmis_cek.py
      - name: XU100 200 gunluk ortalama mesafesini hesapla (yeni veri cekmez)
        run: python xu100_ma_hesapla.py
      - name: Kaydet
        run: |
          git config user.name "gnc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gnc-panel/endeks_gecmis gnc-panel/xu100_ma_mesafe.json
          git commit -m "Endeks gunluk fiyat gecmisi ve MA200 mesafesi guncellendi" || { echo "Degisiklik yok"; exit 0; }
          git pull --rebase --autostash origin main
          git push
