name: BIST hisse fiyat verisi guncelle

on:
  schedule:
    # Hafta ici seans saatlerinde SAATLIK (UTC 07:00-15:00 = TR 10:00-18:00)
    - cron: "0 7-15 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: veri-yazma
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kutuphaneleri yukle
        run: pip install isyatirimhisse pandas
      - name: Hisse verisini cek
        run: python hisse_veri_cek.py
      - name: Kaydet
        run: |
          git config user.name "gnc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gnc-panel/sektor_hisse_veri.json
          git commit -m "Hisse fiyat verisi guncellendi" || { echo "Degisiklik yok"; exit 0; }
          git pull --rebase --autostash origin main
          git push
