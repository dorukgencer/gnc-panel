name: Hisse finansal verisi guncelle

on:
  schedule:
    # Ayin 3'unde 06:00 UTC (finansallar ceyrekte bir; ayda bir yeterli)
    - cron: "0 6 3 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: veri-yazma
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kutuphaneleri yukle
        run: pip install isyatirimhisse pandas
      - name: Finansallari cek
        run: python hisse_finansal_cek.py
      - name: Kaydet
        run: |
          git config user.name "gnc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gnc-panel/finansal
          git commit -m "Hisse finansallari guncellendi" || { echo "Degisiklik yok"; exit 0; }
          git pull --rebase --autostash origin main
          git push
