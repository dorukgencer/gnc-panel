name: Hisse finansal verisi guncelle

on:
  schedule:
    # Her gun 16:30 UTC (19:30 TR) - KAP bilancolari genelde kapanis sonrasi gelir.
    # Toplu cekim ~5 dk surdugu icin gunluk calismak sorun degil; yeni bilanco
    # ertesi gun otomatik panele duser (git yalnizca degisen dosyayi commit'ler).
    - cron: "30 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: veri-finansal
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kutuphaneleri yukle
        run: pip install isyatirimhisse pandas
      - name: Finansallari cek
        run: python hisse_finansal_cek.py
      - name: Kaydet
        run: |
          git config user.name "gnc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gnc-panel/finansal
          git commit -m "Hisse finansallari guncellendi" || { echo "Degisiklik yok"; exit 0; }
          git pull --rebase --autostash origin main
          git push
