name: Hisse finansal verisi guncelle

on:
  schedule:
    # DEGISTI: gunluk -> haftalik. KAP bilancolari ceyreklik aciklaniyor,
    # gunluk cekmenin anlami yoktu ve script paralelsizken 4 saate kadar
    # suruyordu (dakika butcesini tek basina bitiriyordu). Pazar 16:30 UTC
    # (19:30 TR) - hafta ici piyasa/fiyat islerine denk gelmesin diye.
    # Bilanco sezonunda (Sub-Mar / May / Agu / Kas-Ara) elle (workflow_dispatch)
    # ekstra bir kere daha tetiklenebilir.
    - cron: "30 16 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: veri-finansal
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    # EKLENDI: guvenlik agi, 240 dk (4 saat) - eski sinirsiz davranisa yakin
    # birakildi, ilk birkac calistirmada GERCEK suреyi gozlemleyip (Actions
    # log'undan) sonra bu sayiyi gercek sureye gore asagi cekecegiz.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kutuphaneleri yukle
        run: pip install isyatirimhisse pandas
      - name: Finansallari cek
        run: python hisse_finansal_cek.py
      - name: Buyume endeksini hesapla (yeni veri cekmez, mevcut finansallardan)
        run: python buyume_hesapla.py
      - name: Kaydet
        run: |
          git config user.name "gnc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gnc-panel/finansal gnc-panel/buyume_gecmis.json
          git commit -m "Hisse finansallari ve buyume endeksi guncellendi" || { echo "Degisiklik yok"; exit 0; }
          git pull --rebase --autostash origin main
          git push
