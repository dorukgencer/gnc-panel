name: Turkiye ekonomik takvim guncelle

on:
  schedule:
    - cron: "0 6 * * 1-5"
    - cron: "0 15 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: veri-yazma
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kutuphaneleri yukle
        run: pip install borsapy pandas
      - name: Turkiye takvimini cek
        run: python turkiye_cek.py
      - name: Kaydet
        run: |
          git config user.name "gnc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gnc-panel/turkiye_takvim.json
          git commit -m "Turkiye takvimi guncellendi" || { echo "Degisiklik yok"; exit 0; }
          git pull --rebase --autostash origin main
          git push
