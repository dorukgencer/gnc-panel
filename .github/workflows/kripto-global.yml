name: Kripto global metrikleri guncelle (BTC dominans, toplam PD)

on:
  schedule:
    - cron: "45 */6 * * *"  # gunde 4 kez, agir olmayan bir istek
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: veri-kripto-global
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kutuphaneleri yukle
        run: pip install requests
      - name: Kripto global metriklerini cek
        run: python kripto_global_cek.py
      - name: Kaydet
        run: |
          git config user.name "gnc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gnc-panel/kripto_global.json
          git commit -m "Kripto global metrikleri guncellendi" || { echo "Degisiklik yok"; exit 0; }
          git pull --rebase --autostash origin main
          git push
