name: Piyasa guncelle (sektor + hisse, TEK RUN)

on:
  schedule:
    # DEGISTI (dakika butcesi icin): 10 dk -> 30 dk. Panel "donemsel okuma"
    # icin tasarlandi, gun ici 10 dk hassasiyete ihtiyac yok - 30 dk'da bir
    # yeterince taze. Hafta ici TR 10:00-18:00 (UTC 07-15).
    - cron: "*/30 7-15 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: veri-piyasa
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kutuphaneleri yukle
        run: pip install isyatirimhisse pandas
      - name: Piyasa verisini cek (sektor + hisse, ayni anda)
        run: python piyasa_cek.py
      - name: Kaydet
        run: |
          git config user.name "gnc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gnc-panel/sektor_verisi.json gnc-panel/sektor_hisse_veri.json
          git commit -m "Piyasa verisi guncellendi (sektor + hisse, tek run)" || { echo "Degisiklik yok"; exit 0; }
          git pull --rebase --autostash origin main
          git push
