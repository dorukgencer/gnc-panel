name: Piyasa guncelle (sektor + hisse, TEK RUN)

on:
  schedule:
    # Hafta ici her 10 dk, TR 10:00-18:00 (UTC 07-15). Sektor ve hisse
    # ARTIK TEK SCRIPT'TE (piyasa_cek.py) ve ayni zaman damgasiyla yazilir;
    # boylece endeks ve icindeki hisseler HER ZAMAN ayni ana ait olur.
    - cron: "*/10 7-15 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: veri-piyasa
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kutuphaneleri yukle
        run: pip install isyatirimhisse pandas
      - name: Piyasa verisini cek (sektor + hisse, ayni anda)
        run: python piyasa_cek.py
      - name: Kaydet
        run: |
          git config user.name "gnc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gnc-panel/sektor_verisi.json gnc-panel/sektor_hisse_veri.json
          git commit -m "Piyasa verisi guncellendi (sektor + hisse, tek run)" || { echo "Degisiklik yok"; exit 0; }
          git pull --rebase --autostash origin main
          git push
