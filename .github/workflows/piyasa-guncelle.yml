name: Piyasa guncelle (sektor + hisse birlikte)

on:
  schedule:
    # Hafta ici her 30 dk, TR 10:00-18:00 (UTC 07-15). Sektor ve hisse AYNI
    # calismada cekilir; boylece endeks ve icindeki hisseler her zaman ayni ana aittir.
    - cron: "*/30 7-15 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: veri-yazma
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kutuphaneleri yukle
        run: pip install isyatirimhisse borsapy pandas
      - name: Sektor verisini cek
        run: python sektor_cek.py
      - name: Hisse verisini cek
        run: python hisse_veri_cek.py
      - name: Kaydet
        run: |
          git config user.name "gnc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gnc-panel/sektor_verisi.json gnc-panel/sektor_hisse_veri.json
          git commit -m "Piyasa verisi guncellendi (sektor + hisse)" || { echo "Degisiklik yok"; exit 0; }
          git pull --rebase --autostash origin main
          git push
