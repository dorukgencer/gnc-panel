name: Piyasa guncelle (sektor + hisse, TEK RUN)

on:
  schedule:
    # DEGISIKLIK (14 Tem 2026): 10 dk -> 30 dk. Eski sikliK (hafta ici her
    # 10 dk, 8 saat = gunde ~48 calisma) tek basina aylik ~1.270 dk yiyordu -
    # GitHub'in 2.000 dk ucretsiz kotasinin yarisindan fazlasi. Panel zaten
    # "donemsel okuma" felsefesinde, 10 dakikalik tazelik gereksiz.
    # 30 dk ile ayni is ~420 dk'ya duser, veri kalitesi ayni kalir.
    # 30 DAKIKA - BILINCLI TERCIH (16 Agu 2026)
    # Borsa verisinin taze olmasi panelin en kritik ozelligi. 60 dk denendi ama
    # cron gecikmesiyle birlikte fiili tazelik 75 dk'ya cikiyordu - fazla eski.
    # 30 dk'da ayda ~387 calisma / ~580 dk tuketir; 3.000 dk'lik kotada sorun yok.
    - cron: "*/30 7-15 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: veri-piyasa
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kutuphaneleri yukle
        run: pip install isyatirimhisse pandas
      - name: Piyasa verisini cek (sektor + hisse, ayni anda)
        run: python piyasa_cek.py
      - name: Sirket listesi + ceyreklik TUFE hazirla (Sirketler sayfasi icin)
        run: python sirket_listesi_hazirla.py
      - name: Kaydet
        run: |
          git config user.name "gnc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gnc-panel/sektor_verisi.json gnc-panel/sektor_hisse_veri.json gnc-panel/sirket_listesi.json gnc-panel/tufe_ceyreklik.json
          git commit -m "Piyasa verisi guncellendi (sektor + hisse, tek run)" || { echo "Degisiklik yok"; exit 0; }
          git pull --rebase --autostash origin main
          git push
