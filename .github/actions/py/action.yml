name: "Python hazirlik (cache'li)"
description: "Checkout + Python 3.12 + pip cache. Tum is akislari bunu kullanir."
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"
        cache-dependency-path: requirements.txt
    - shell: bash
      run: pip install -q -r requirements.txt
