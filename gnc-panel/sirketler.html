<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şirketler — GNC Insight</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="ortak.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  /* ---------- Liste görünümü ---------- */
  /* FİLTRE KARTI — diğer bölümlerle aynı kart diline uysun diye
     gnc-panel-kart içine alındı, etiketli alanlarla hizalandı. */
  .sl-filtre-kart { margin-bottom:18px; padding:16px 20px; }
  .sl-filtre-satir { display:grid; grid-template-columns:2fr 1fr 1fr; gap:14px; align-items:end; }
  @media (max-width:760px){ .sl-filtre-satir { grid-template-columns:1fr; } }
  .sl-alan { display:flex; flex-direction:column; min-width:0; }
  .sl-etiket { font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); font-weight:600; margin-bottom:5px; }
  .sl-arama, .sl-select {
    width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px;
    background:var(--surface-raised); font-size:16px; color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
  }
  .sl-arama:focus, .sl-select:focus { outline:none; border-color:var(--copper-dark); }
  .sl-tablo { width:100%; min-width:560px; border-collapse:collapse; font-size:12.5px; }
  .sl-tablo thead th { text-align:left; padding:8px 10px 8px 0; border-bottom:1px solid var(--line-strong); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); font-weight:600; white-space:nowrap; }
  .sl-tablo thead th.num, .sl-tablo tbody td.num { text-align:right; }
  .sl-tablo tbody td { padding:9px 10px 9px 0; border-bottom:1px solid var(--line); }
  .sl-tablo tbody tr:hover { background:rgba(0,0,0,0.02); cursor:pointer; }
  .sl-kod { font-weight:600; }
  .sl-ad { font-size:10.5px; color:var(--ink-faint); }
  .sl-sektor-etiket { display:inline-block; font-size:10px; padding:2px 7px; border-radius:10px; background:var(--surface); border:1px solid var(--line); color:var(--ink-soft); white-space:nowrap; }

  /* ---------- Detay: sekmeler ---------- */
  .sd-baslik { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:4px; }
  .sd-kod { font-family:'Fraunces',serif; font-size:26px; font-weight:600; }
  .sd-ad { color:var(--ink-soft); font-size:13px; }
  .sd-fiyat { margin-left:auto; text-align:right; }
  .sd-fiyat .buyuk { font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600; }
  .sd-geri { display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--ink-soft); margin-bottom:14px; }
  .sd-sekmeler { display:flex; gap:2px; border-bottom:1px solid var(--line-strong); flex-wrap:wrap; margin:16px 0 18px; }
  .sd-sekme { padding:9px 14px; font-size:13px; color:var(--ink-faint); cursor:pointer; border-bottom:2px solid transparent; background:none; border-top:none; border-left:none; border-right:none; }
  .sd-sekme:hover { color:var(--ink); }
  .sd-sekme.aktif { color:var(--ink); border-bottom:2px solid var(--copper-dark); font-weight:500; }
  .sd-alt-sekmeler { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
  .sd-alt-sekme { padding:6px 12px; font-size:12px; border:1px solid var(--line); border-radius:7px; background:var(--surface-raised); color:var(--ink-soft); cursor:pointer; }
  .sd-alt-sekme.aktif { background:var(--ink); color:#fff; border-color:var(--ink); font-weight:600; }

  /* ---------- Enflasyon düğmesi ---------- */
  .sd-arac-satir { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .sd-switch { width:38px; height:21px; border-radius:12px; background:var(--line-strong); position:relative; cursor:pointer; flex-shrink:0; transition:background .15s; }
  .sd-switch::after { content:''; position:absolute; top:2.5px; left:2.5px; width:16px; height:16px; border-radius:50%; background:#fff; transition:left .15s; }
  .sd-switch.acik { background:var(--pine); }
  .sd-switch.acik::after { left:19.5px; }
  .sd-switch-not { font-size:10.5px; color:var(--ink-faint); }

  /* ---------- Grafik ---------- */
  .sd-grafik-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:1000px){ .sd-grafik-grid { grid-template-columns:1fr; } }
  .sd-grafik-baslik { font-family:'Fraunces',serif; font-size:14px; font-weight:600; }
  .sd-grafik-alt { font-size:10.5px; color:var(--ink-faint); margin-top:2px; }
  .sd-lejant { display:flex; gap:14px; flex-wrap:wrap; font-size:10.5px; color:var(--ink-soft); margin:10px 0 4px; }
  .sd-lejant .kutu { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px; vertical-align:middle; }
  .sd-lejant .cizgi { display:inline-block; width:13px; border-top:2px solid; margin-right:4px; vertical-align:middle; }
  .sd-grafik-dis { position:relative; }
  .sd-grafik-dis svg { display:block; width:100%; height:auto; }
  .sd-tooltip {
    position:absolute; display:none; z-index:60; pointer-events:none;
    background:var(--surface-raised); border:1px solid var(--line-strong); border-radius:7px;
    padding:8px 10px; font-size:11px; box-shadow:0 6px 18px rgba(0,0,0,.10); min-width:150px;
  }
  .sd-tooltip .tt-donem { font-weight:600; margin-bottom:5px; padding-bottom:4px; border-bottom:1px solid var(--line); }
  .sd-tooltip .tt-satir { display:flex; justify-content:space-between; gap:14px; padding:1.5px 0; }
  .sd-tooltip .tt-deger { font-family:'IBM Plex Mono',monospace; font-weight:600; }

  /* ---------- Finansal tablo ---------- */
  .fin-tablo { width:100%; border-collapse:collapse; font-size:11.5px; min-width:700px; }
  .fin-tablo th { position:sticky; top:0; background:var(--surface); text-align:right; padding:11px 12px; border-bottom:1px solid var(--line-strong); font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-faint); white-space:nowrap; }
  .fin-tablo th:first-child { text-align:left; min-width:250px; }
  .fin-tablo td { padding:11px 12px; border-bottom:1px solid var(--line); text-align:right; font-family:'IBM Plex Mono',monospace; white-space:nowrap; line-height:1.5; }
  .fin-tablo td:first-child { text-align:left; font-family:'IBM Plex Sans',sans-serif; color:var(--ink-soft); padding-right:20px; }
  .fin-tablo tr:hover td { background:rgba(0,0,0,0.02); }
  /* ANA KALEMLER: daha büyük, kalın, hafif zeminli - gözün hiyerarşiyi
     yakalaması için (Finvest'teki gibi). */
  .fin-tablo tr.ana td { background:rgba(0,0,0,0.02); font-size:12.5px; font-weight:600; color:var(--ink); }
  .fin-tablo tr.ana td:first-child { font-weight:700; font-size:12.5px; color:var(--ink); }
  /* ALT kalemler biraz içeride ve soluk - alt kırılım olduğu belli olsun */
  .fin-tablo tr:not(.ana) td:first-child { padding-left:16px; }
  /* Dönemler arası % değişim rozeti */
  .fin-rozet { display:inline-block; margin-left:7px; font-size:9.5px; font-weight:600;
    padding:1px 5px; border-radius:9px; font-family:'IBM Plex Sans',sans-serif; white-space:nowrap; }
  .fin-rozet.up   { background:#CDDCD3; color:#124B3F; }
  .fin-rozet.down { background:#E7D2CC; color:#9B3A2C; }
  .fin-rozet.notr { background:var(--surface); color:var(--ink-faint); }

  /* ---------- Özel grafik paneli ---------- */
  .oz-panel { border:1px dashed var(--line-strong); border-radius:var(--radius); padding:16px; margin-top:16px; }
  .oz-form { display:grid; grid-template-columns:1fr 1fr auto; gap:10px; align-items:end; }
  @media (max-width:760px){ .oz-form { grid-template-columns:1fr; } }
  .oz-etiket { display:block; font-size:10.5px; color:var(--ink-faint); margin-bottom:4px; }
  .oz-select { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:7px; background:var(--surface-raised); font-size:16px; color:var(--ink); }
  .oz-btn { padding:9px 16px; border:1px solid var(--ink); border-radius:7px; background:var(--ink); color:#fff; font-size:12.5px; cursor:pointer; font-weight:600; white-space:nowrap; }

  /* ---------- Mevsimsellik ısı haritası ---------- */
  .mv-tablo { width:100%; border-collapse:separate; border-spacing:3px; font-size:11px; min-width:760px; }
  .mv-tablo th { font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.06em;
    color:var(--ink-faint); font-weight:600; padding:4px 2px; text-align:center; }
  .mv-tablo th.yil { text-align:left; }
  .mv-tablo td { text-align:center; padding:9px 4px; border-radius:5px;
    font-family:'IBM Plex Mono',monospace; font-weight:600; white-space:nowrap; }
  .mv-tablo td.yil { background:none; color:var(--ink); font-weight:700; text-align:left; font-size:12px; }
  .mv-tablo td.bos { background:var(--surface); color:var(--ink-faint); font-weight:400; }
  .mv-tablo td.toplam { font-weight:700; }
  .mv-tablo th.toplam { color:var(--ink); }

  .gnc-png-indir { display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%; border:1px solid var(--line-strong); background:var(--surface-raised); color:var(--ink-faint); cursor:pointer; margin-left:auto; flex-shrink:0; }
  .gnc-png-indir:hover { color:var(--copper-dark); border-color:var(--copper-dark); }
  .gnc-png-indir svg { width:12px; height:12px; }
  .gnc-png-indir.yukleniyor { opacity:.5; pointer-events:none; }
  .sd-veri-zaman { margin-top:10px; padding-top:8px; border-top:1px dashed var(--line); font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-faint); text-align:right; }
</style>
</head>
<body>
<div class="gnc-shell">
  <aside class="gnc-sidebar" id="sidebar"></aside>
  <main class="gnc-main">
    <div class="gnc-topbar">
      <div class="baslik-satiri"><h1 id="ust-baslik">Şirketler</h1></div>
      <span class="gnc-donem" id="ust-donem">—</span>
    </div>
    <div class="gnc-content">
      <div id="liste-gorunum"></div>
      <div id="detay-gorunum" style="display:none;"></div>
    </div>
  </main>

<script src="ortak.js"></script>
<script>
/* ============================================================
   ŞİRKETLER SAYFASI
   Tek dosya: ?kod=THYAO yoksa LİSTE, varsa DETAY görünümü.
   Ayrı HTML dosyası üretmiyoruz - deploy maliyeti ve dosya
   sayısı kontrol altında kalsın diye (Doruk'un Netlify kredi
   ve GitHub dakika kısıtı).
   ============================================================ */

let SIRKETLER = [];        // sirket_listesi.json
let TUFE = {};             // tufe_ceyreklik.json -> endeksler (çeyreklik)
let TUFE_AYLIK = {};       // aylık TÜFE - mevsimsellikte reel getiri için
let AKTIF_KOD = null;
let FIN = null;            // finansal/{KOD}.json
let FIYAT = null;          // hisse_gecmis/{KOD}.json
let SEKME = "finansallar"; // "finansallar" | "karne"
let ALT_SEKME = "bilanco"; // "bilanco" | "gelir" | "nakit"
let ENFLASYON = true;      // enflasyon düzeltmesi açık mı
let PERIYOT = "yillik";    // "ceyreklik" | "yillik" (yıllık = son 4 çeyrek toplamı)
let OZEL_GRAFIKLER = [];   // kullanıcının eklediği ek grafikler
let TUM_KALEMLER = false;  // false = tamamen boş/sıfır satırlar gizli
let DEGISIM_GOSTER = true; // tabloda dönemler arası % değişim rozetleri

/* ---------- Finansal tablo bölümleme ----------
   Kalemler kaynak dosyada DOĞAL SIRAYLA geliyor: önce bilanço,
   sonra gelir tablosu, sonra nakit akım. Sınırları bilinen
   "dönüm noktası" kalem adlarıyla buluyoruz. Bu, kalem adı
   tahminine göre çok daha sağlam - sıra bozulmadıkça çalışır. */
const SINIR_BILANCO_SON = ["TOPLAM KAYNAKLAR", "PASİF TOPLAMI"];
const SINIR_NAKIT_BAS = ["İşletme Faaliyetlerinden Kaynaklanan Net Nakit", "İşletme Faaliyetlerinden Nakit Akışları"];

function bolumle(kalemler){
  const adlar = kalemler.map(k => k.ad);
  let bilancoSon = -1, nakitBas = -1;
  SINIR_BILANCO_SON.forEach(s => { const i = adlar.indexOf(s); if(i > bilancoSon) bilancoSon = i; });
  SINIR_NAKIT_BAS.forEach(s => { const i = adlar.indexOf(s); if(i >= 0 && (nakitBas < 0 || i < nakitBas)) nakitBas = i; });
  if(bilancoSon < 0) bilancoSon = Math.floor(kalemler.length * 0.45);
  if(nakitBas < 0 || nakitBas <= bilancoSon) nakitBas = Math.floor(kalemler.length * 0.85);
  return {
    bilanco: kalemler.slice(0, bilancoSon + 1),
    gelir:   kalemler.slice(bilancoSon + 1, nakitBas),
    nakit:   kalemler.slice(nakitBas),
  };
}

/* ---------- Dönem yardımcıları ---------- */
function donemAnahtar(d){ const [y,q] = d.split("/"); return parseInt(y)*100 + parseInt(q); }
function donemEtiket(d){ const [y,q] = d.split("/"); return `${y}Ç${Math.ceil(parseInt(q)/3)}`; }

/* Enflasyon çarpanı: o çeyrekteki 1 TL, BUGÜN kaç TL eder.
   TÜFE endeksi yoksa 1 döner (düzeltme yapılmaz, veri bozulmaz). */
/* Enflasyon düzeltmesinin BAZ dönemi.
   DEĞİŞİKLİK (16 Ağu 2026): Eskiden "en son TÜFE ayına" taşıyorduk. Ama
   Finvest/Fintables ile karşılaştırınca değerlerimiz SABİT 1,070 oranında
   düşük çıktı (Dönen Varlıklar 1,0697 · Duran Varlıklar 1,0700 — birebir
   aynı oran). Oranın her kalemde aynı olması, ham verinin ve hesabın DOĞRU
   olduğunu, sadece BAZIN farklı olduğunu kanıtladı.
   Finvest'in tablosunda en son çeyrekte yıldız YOK, öncekilerde VAR — yani
   onlar "bugüne" değil EN SON BİLANÇO DÖNEMİNE taşıyor. Bu, TMS 29'un
   standart yaklaşımı (karşılaştırmalı dönemler cari raporlama dönemine
   yeniden ifade edilir). Aynı yönteme geçtik. */
let TUFE_BAZ_DONEM = null;   // "YYYY/Q" - en son finansal dönem
function tufeBazDegeriniBelirle(donemler){
  // Elimizdeki en son finansal dönem için TÜFE endeksi varsa onu baz al.
  // Yoksa (o çeyreğin TÜFE'si henüz açıklanmamışsa) en son bilinen TÜFE'ye düş.
  const sirali = donemler.slice().sort((a,b) => donemAnahtar(b) - donemAnahtar(a));
  for(const d of sirali){
    if(TUFE[d]){ TUFE_BAZ_DONEM = d; return; }
  }
  TUFE_BAZ_DONEM = null;
}
function enflasyonCarpani(donem){
  if(!ENFLASYON) return 1;
  const baz = TUFE_BAZ_DONEM ? TUFE[TUFE_BAZ_DONEM] : TUFE["_guncel"];
  const o = TUFE[donem];
  if(!baz || !o) return 1;
  return baz / o;
}

/* Bir kalemin dönem->değer haritasını, seçili dönemler için diziye çevirir.
   ENFLASYON açıksa her değeri kendi çeyreğinin çarpanıyla bugüne taşır. */
function seriHam(kalem, donemler){
  // HAM değerler - enflasyon UYGULANMAZ. Kümülatif çıkarma işlemi bu ham
  // değerler üzerinde yapılmalı (bkz. enflasyonUygula açıklaması).
  if(!kalem) return donemler.map(() => null);
  return donemler.map(d => {
    const v = kalem.degerler[d];
    return (v === undefined || v === null) ? null : v;
  });
}

/* KRİTİK İŞLEM SIRASI (16 Ağu 2026'da bulunan hata):
   Enflasyon düzeltmesi, kümülatiften çeyrekliğe çevirmeden SONRA
   uygulanmalıdır. Önce uygulanırsa şu olur:
     Q2 = H1×m(6) − Q1×m(3)     ← YANLIŞ, m(3) > m(6) olduğu için fazla çıkarır
   Doğrusu:
     Q2 = (H1 − Q1) × m(6)       ← önce çıkar, sonra taşı
   Yanlış sıra değerleri KÜÇÜLTÜYORDU: AGHOL 2026Ç1'de enflasyon açıkken
   755,99 Mr, kapalıyken 788,95 Mr çıkıyordu — düzeltme değeri küçültemez,
   bu imkânsız. Finvest'te aynı dönem 757,5 → 842,1 (büyüyor, doğru yön). */
function enflasyonUygula(seri, donemler){
  return seri.map((v, i) => (v === null || v === undefined) ? null : v * enflasyonCarpani(donemler[i]));
}

/* Geriye dönük uyumluluk: enflasyonu doğrudan uygulayan eski sarmalayıcı.
   SADECE kümülatif olmayan (stok/bilanço) kalemler için güvenlidir. */
function seriCikar(kalem, donemler){
  return enflasyonUygula(seriHam(kalem, donemler), donemler);
}

/* KÜMÜLATİFTEN ÇEYREKLİĞE ÇEVİRME — kritik düzeltme (16 Ağu 2026).
   Türkiye'de gelir tablosu ve nakit akım tabloları KÜMÜLATİF raporlanır:
     /3  = Q1 (3 aylık)
     /6  = Q1+Q2 (6 aylık, yılbaşından beri)
     /9  = Q1+Q2+Q3 (9 aylık)
     /12 = tüm yıl (12 aylık)
   Bunu fark etmeden 4 dönemi toplayınca 4×Q1 + 3×Q2 + 2×Q3 + Q4 elde ediliyordu -
   gerçek yıllığın ~2,5 KATI. Finvest'le karşılaştırınca oran 2,73 çıktı ve bu
   teoriyi doğruladı (bilanço kalemlerinde sapma sadece 1,07'ydi çünkü bilanço
   STOK verisidir, kümülatif değildir).
   Bu fonksiyon her dönemden bir öncekini çıkararak GERÇEK çeyreklik değeri
   verir. Bilanço (stok) kalemlerine UYGULANMAZ. */
function kumulatiftenCeyrege(seri, donemler){
  return seri.map((v, i) => {
    if(v === null || v === undefined) return null;
    const [yil, ay] = donemler[i].split("/").map(Number);
    if(ay === 3) return v;              // Q1 zaten tek çeyrek
    const oncekiDonem = `${yil}/${ay - 3}`;
    const j = donemler.indexOf(oncekiDonem);
    if(j < 0 || seri[j] === null || seri[j] === undefined) return null;
    return v - seri[j];
  });
}

/* Yıllıklandırma (TTM): her nokta için kendisi + önceki 3 ÇEYREĞİN toplamı.
   GİRDİ ARTIK GERÇEK ÇEYREKLİK olmalı (kumulatiftenCeyrege'den geçmiş).
   Bilanço kalemlerinde toplama YAPILMAZ (stok değeri, akış değil). */
function yilliklandir(seri, stokMu){
  if(PERIYOT !== "yillik") return seri;
  if(stokMu) return seri;  // bilanço kalemi: son değer zaten geçerli
  return seri.map((_, i) => {
    if(i < 3) return null;
    const dilim = seri.slice(i-3, i+1);
    if(dilim.some(v => v === null)) return null;
    return dilim.reduce((a,b) => a+b, 0);
  });
}

/* ANA KALEMLER — tabloda büyük ve kalın gösterilecek satırlar.
   Sadece "tümü büyük harf" kuralı yetmiyordu: Finvest "Dönen Varlıklar",
   "Özkaynaklar" gibi normal yazımlı ana başlıkları da vurguluyor. */
const ANA_KALEM_ADLARI = new Set([
  // Bilanço
  "Dönen Varlıklar","Duran Varlıklar","TOPLAM VARLIKLAR","AKTİF TOPLAMI","KAYNAKLAR",
  "Kısa Vadeli Yükümlülükler","Uzun Vadeli Yükümlülükler","TOPLAM KAYNAKLAR","PASİF TOPLAMI",
  "Özkaynaklar","XVI. ÖZKAYNAKLAR","Ana Ortaklığa Ait Özkaynaklar","Ödenmiş Sermaye",
  // Gelir tablosu
  "Satış Gelirleri","Hasılat","Satışların Maliyeti (-)","BRÜT KAR (ZARAR)",
  "FAALİYET KARI (ZARARI)","DÖNEM KARI (ZARARI)","Dönem Net Kar/Zararı",
  "SÜRDÜRÜLEN FAALİYETLER VERGİ ÖNCESİ KARI (ZARARI)","Hisse Başına Kazanç",
  // Nakit akım
  "İşletme Faaliyetlerinden Kaynaklanan Net Nakit","Serbest Nakit Akım",
  "Yatırım Faaliyetlerinden Kaynaklanan Nakit","Finansman Faaliyetlerden Kaynaklanan Nakit",
  "Dönem Sonu Nakit",
]);
function anaKalemMi(ad){
  if(ANA_KALEM_ADLARI.has(ad)) return true;
  // Tümü büyük harf + yeterince uzun olanlar da ana başlık sayılır
  // (bankaların "XVIII. NET DÖNEM KARI/ZARARI" gibi başlıkları için).
  return ad === ad.toLocaleUpperCase("tr-TR") && ad.length > 6;
}

function kalemBul(kalemler, adaylar){
  for(const ad of adaylar){
    const k = kalemler.find(x => x.ad === ad);
    if(k) return k;
  }
  return null;
}

/* ---------- Sayı biçimleme ---------- */
function trSayi(v, ondalik){
  if(v === null || v === undefined || isNaN(v)) return "—";
  return v.toLocaleString("tr-TR", { minimumFractionDigits: ondalik ?? 0, maximumFractionDigits: ondalik ?? 0 });
}
function paraKisa(v){
  if(v === null || v === undefined || isNaN(v)) return "—";
  const m = Math.abs(v);
  if(m >= 1e9)  return (v/1e9).toLocaleString("tr-TR",{maximumFractionDigits:2}) + " Mr";
  if(m >= 1e6)  return (v/1e6).toLocaleString("tr-TR",{maximumFractionDigits:1}) + " Mn";
  if(m >= 1e3)  return (v/1e3).toLocaleString("tr-TR",{maximumFractionDigits:1}) + " B";
  return trSayi(v, 0);
}

/* ============================================================
   GRAFİK MOTORU (bar + çizgi, çift eksen, hover tooltip)
   ============================================================ */
function grafikCiz(hedefId, cfg){
  const kap = document.getElementById(hedefId);
  if(!kap) return;
  const etiketler = cfg.etiketler;
  const N = etiketler.length;
  if(!N){ kap.innerHTML = '<div class="gnc-durum-kutu">Bu grafik için yeterli veri yok.</div>'; return; }

  // TUM seriler bossa bos eksen cizmek yerine NEDENINI soyle (16 Agu 2026:
  // AKBNK'de grafikler bos eksenle cikip kafa karistirdi).
  const tumVeriler = [...(cfg.bar ? cfg.bar.veriler : []), ...cfg.cizgiler.flatMap(c => c.veriler)];
  if(!tumVeriler.some(v => v !== null && v !== undefined)){
    kap.innerHTML = '<div class="gnc-durum-kutu">Bu şirketin tablosunda bu grafiğe ait kalemler bulunamadı.<br><span style="font-size:10.5px;color:var(--ink-faint);">Bankalar ve sigorta şirketleri farklı tablo formatı kullanır.</span></div>';
    return;
  }

  // DUZELTME (16 Agu 2026): Genislik ARTIK kap.clientWidth'e bagli DEGIL.
  // Onceden kartlar DOM'a tam yerlesmeden olculuyordu, yanlis genislik
  // cikip grafik kutudan tasip kayiyordu (ozellikle sagdaki kartlarda).
  // Simdi SABIT koordinat sisteminde cizip SVG'yi width:100% ile
  // olcekliyoruz - her zaman kutuya TAM oturur, olcum hatasi imkansiz.
  const TASARIM_GENISLIK = 720;
  const yuk = 230, padL = 62, padR = cfg.cizgiler.length ? 62 : 16, padT = 12, padB = 42;
  const cizimYuk = yuk - padT - padB;
  const cizimGen = TASARIM_GENISLIK - padL - padR;
  const aralik = cizimGen / Math.max(N, 1);
  const genislik = TASARIM_GENISLIK;

  // Bar ekseni (sol)
  const barDeg = (cfg.bar ? cfg.bar.veriler : []).filter(v => v !== null);
  let barMin = Math.min(0, ...(barDeg.length ? barDeg : [0]));
  let barMax = Math.max(...(barDeg.length ? barDeg : [1]));
  if(barMax === barMin) barMax = barMin + 1;
  barMax += (barMax - barMin) * 0.14;

  // Çizgi ekseni (sağ)
  const cizgiDeg = cfg.cizgiler.flatMap(c => c.veriler).filter(v => v !== null);
  let cMin = cizgiDeg.length ? Math.min(...cizgiDeg) : 0;
  let cMax = cizgiDeg.length ? Math.max(...cizgiDeg) : 1;
  if(cfg.sifirCizgisi){ cMin = Math.min(cMin, 0); cMax = Math.max(cMax, 0); }
  const cPay = (cMax - cMin) * 0.14 || 1;
  cMin -= cPay; cMax += cPay;

  const x  = i => padL + aralik * (i + 0.5);
  const yB = v => padT + (1 - (v - barMin) / (barMax - barMin)) * cizimYuk;
  const yC = v => padT + (1 - (v - cMin) / (cMax - cMin)) * cizimYuk;

  let svg = `<svg width="100%" height="auto" viewBox="0 0 ${genislik} ${yuk}" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;height:auto;" xmlns="http://www.w3.org/2000/svg">`;

  // Yatay ızgara + sol eksen etiketleri
  for(let i=0;i<=4;i++){
    const oran = i/4;
    const yy = padT + oran * cizimYuk;
    const deger = barMax - oran * (barMax - barMin);
    svg += `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${padL+cizimGen}" y2="${yy.toFixed(1)}" stroke="#CFD6CC" stroke-width="1" stroke-dasharray="2 3"/>`;
    svg += `<text x="${padL-7}" y="${(yy+3.5).toFixed(1)}" text-anchor="end" font-size="9" fill="#8D958E" font-family="IBM Plex Mono,monospace">${paraKisa(deger)}</text>`;
  }
  // Sağ eksen etiketleri
  if(cfg.cizgiler.length){
    for(let i=0;i<=4;i++){
      const oran = i/4;
      const yy = padT + oran * cizimYuk;
      const deger = cMax - oran * (cMax - cMin);
      const metin = cfg.sagEksenPara === false
        ? deger.toLocaleString("tr-TR",{maximumFractionDigits:1})
        : paraKisa(deger);
      svg += `<text x="${padL+cizimGen+7}" y="${(yy+3.5).toFixed(1)}" text-anchor="start" font-size="9" fill="#8D958E" font-family="IBM Plex Mono,monospace">${metin}</text>`;
    }
  }
  // Sıfır çizgisi
  if(barMin < 0){
    const y0 = yB(0);
    svg += `<line x1="${padL}" y1="${y0.toFixed(1)}" x2="${padL+cizimGen}" y2="${y0.toFixed(1)}" stroke="#8D958E" stroke-width="1"/>`;
  }

  // Barlar
  if(cfg.bar){
    const bg = Math.min(aralik * 0.62, 22);
    cfg.bar.veriler.forEach((v,i) => {
      if(v === null) return;
      const y0 = yB(Math.max(0, Math.min(v, 0) === v ? 0 : 0));
      const yv = yB(v);
      const ust = v >= 0 ? yv : yB(0);
      const h = Math.abs(yv - yB(0));
      svg += `<rect x="${(x(i)-bg/2).toFixed(1)}" y="${ust.toFixed(1)}" width="${bg.toFixed(1)}" height="${Math.max(h,0.5).toFixed(1)}" fill="${cfg.bar.renk}" opacity="0.9" rx="2"/>`;
    });
  }

  // Çizgiler
  cfg.cizgiler.forEach(c => {
    let d = "", basladi = false;
    c.veriler.forEach((v,i) => {
      if(v === null){ basladi = false; return; }
      d += (basladi ? " L " : " M ") + x(i).toFixed(1) + " " + yC(v).toFixed(1);
      basladi = true;
    });
    if(d) svg += `<path d="${d}" fill="none" stroke="${c.renk}" stroke-width="2" stroke-linejoin="round"/>`;
    c.veriler.forEach((v,i) => {
      if(v === null) return;
      svg += `<circle cx="${x(i).toFixed(1)}" cy="${yC(v).toFixed(1)}" r="2.4" fill="${c.renk}"/>`;
    });
  });

  // X ekseni etiketleri (kalabalıksa atlayarak)
  const atla = Math.ceil(N / Math.max(1, Math.floor(cizimGen / 52)));
  etiketler.forEach((e,i) => {
    if(i % atla !== 0 && i !== N-1) return;
    svg += `<text x="${x(i).toFixed(1)}" y="${yuk-24}" text-anchor="middle" font-size="8.5" fill="#8D958E" font-family="IBM Plex Mono,monospace" transform="rotate(-45 ${x(i).toFixed(1)} ${yuk-24})">${e}</text>`;
  });

  // Hover şeritleri (tooltip için)
  etiketler.forEach((e,i) => {
    svg += `<rect class="hv" data-i="${i}" x="${(x(i)-aralik/2).toFixed(1)}" y="${padT}" width="${aralik.toFixed(1)}" height="${cizimYuk}" fill="transparent" style="cursor:crosshair;"/>`;
  });

  svg += `</svg><div class="sd-tooltip" id="tip-${hedefId}"></div>`;
  kap.innerHTML = svg;

  // Tooltip davranışı
  const tip = document.getElementById("tip-" + hedefId);
  kap.querySelectorAll("rect.hv").forEach(r => {
    r.addEventListener("mouseenter", () => {
      const i = parseInt(r.dataset.i);
      let html = `<div class="tt-donem">${etiketler[i]}</div>`;
      if(cfg.bar){
        html += `<div class="tt-satir"><span><span class="kutu" style="background:${cfg.bar.renk}"></span>${cfg.bar.ad}</span><span class="tt-deger">${paraKisa(cfg.bar.veriler[i])} ₺</span></div>`;
      }
      cfg.cizgiler.forEach(c => {
        const v = c.veriler[i];
        const gosterim = cfg.sagEksenPara === false
          ? (v === null ? "—" : v.toLocaleString("tr-TR",{maximumFractionDigits:2}) + " ₺")
          : paraKisa(v) + " ₺";
        html += `<div class="tt-satir"><span><span class="cizgi" style="border-color:${c.renk}"></span>${c.ad}</span><span class="tt-deger">${gosterim}</span></div>`;
      });
      tip.innerHTML = html;
      tip.style.display = "block";
      // SVG artik %100 genislikte ESNIYOR - viewBox koordinatini (x(i))
      // dogrudan piksel gibi kullanamayiz, once GERCEK olceklenmis
      // genislige cevirmemiz gerekiyor.
      const gercekGenislik = kap.clientWidth || genislik;
      const olcek = gercekGenislik / genislik;
      const solPx = x(i) * olcek;
      const sagaTasar = solPx + 175 > gercekGenislik;
      tip.style.left = (sagaTasar ? Math.max(6, solPx - 165) : solPx + 12) + "px";
      tip.style.top = (padT * olcek) + "px";
    });
    r.addEventListener("mouseleave", () => { tip.style.display = "none"; });
  });
}

let LISTE_GUNCELLEME = null;

function veriZamaniYaz(id, iso){
  const el = document.getElementById(id);
  if(!el) return;
  if(!iso){ el.textContent = "Veri zamanı bilinmiyor"; return; }
  try {
    const d = new Date(iso);
    const p = n => String(n).padStart(2,'0');
    el.textContent = `Veri güncellenme: ${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
  } catch(e){ el.textContent = "Veri zamanı okunamadı"; }
}

/* ============================================================
   DETAY GÖRÜNÜMÜ
   ============================================================ */
function sirketAc(kod){
  const url = new URL(window.location);
  url.searchParams.set("kod", kod);
  window.history.pushState({}, "", url);
  AKTIF_KOD = kod;
  detayYukle();
}
function listeyeDon(){
  const url = new URL(window.location);
  url.searchParams.delete("kod");
  window.history.pushState({}, "", url);
  AKTIF_KOD = null;
  document.getElementById("detay-gorunum").style.display = "none";
  document.getElementById("liste-gorunum").style.display = "block";
  document.getElementById("ust-baslik").textContent = "Şirketler";
  listeCiz();
}

async function detayYukle(){
  document.getElementById("liste-gorunum").style.display = "none";
  const kap = document.getElementById("detay-gorunum");
  kap.style.display = "block";
  kap.innerHTML = '<div class="gnc-durum-kutu">Yükleniyor…</div>';
  document.getElementById("ust-baslik").textContent = AKTIF_KOD;

  const [fin, fiyat] = await Promise.all([
    gncVeriCek(`finansal/${AKTIF_KOD}.json`),
    gncVeriCek(`hisse_gecmis/${AKTIF_KOD}.json`),
  ]);
  FIN = fin; FIYAT = fiyat;

  if(!FIN || !FIN.kalemler || !FIN.kalemler.length){
    kap.innerHTML = `<a class="sd-geri" href="#" onclick="listeyeDon();return false;">‹ Tüm şirketler</a>
      <div class="gnc-durum-kutu">${AKTIF_KOD} için finansal veri bulunamadı. Bu şirketin bilanço verisi henüz çekilmemiş olabilir.</div>`;
    return;
  }

  // TÜFE bazını bu şirketin EN SON finansal dönemine göre belirle
  // (TMS 29 standardı - Finvest/Fintables de böyle yapıyor).
  const tumDonemler = [...new Set(FIN.kalemler.flatMap(k => Object.keys(k.degerler)))];
  tufeBazDegeriniBelirle(tumDonemler);
  if(TUFE_BAZ_DONEM){
    document.getElementById("ust-donem").textContent = "Enflasyon bazı: " + donemEtiket(TUFE_BAZ_DONEM);
  }
  detayCiz();
}

/* ============================================================
   GELİR AKIŞ DİYAGRAMI (Sankey benzeri)
   Hasılat'tan Net Kâr'a kadar paranın nereye gittiğini gösterir.
   NEGATİF değerlerle çalışır: bant YÜKSEKLİĞİ mutlak değere,
   RENGİ işarete göre belirlenir (HEKTS'te Faaliyet Kârı -371 Mn
   gibi durumlar gerçek — 16 Ağu 2026'da doğrulandı).
   ============================================================ */
function gelirAkisiCiz(hedefId, K, donem){
  const kap = document.getElementById(hedefId);
  if(!kap) return;

  const carpan = enflasyonCarpani(donem);
  // Gelir tablosu KÜMÜLATİF raporlanır - bu diyagram TEK ÇEYREĞİ gösterdiği
  // için o dönemden bir öncekini çıkarıp gerçek çeyrek değerini buluyoruz
  // (Q1 hariç, o zaten tek çeyrek).
  const [dYil, dAy] = donem.split("/").map(Number);
  const oncekiDonem = dAy === 3 ? null : `${dYil}/${dAy - 3}`;
  const ceyrekDegeri = (kalemAdi) => {
    const k = K.find(x => x.ad === kalemAdi);
    if(!k) return null;
    const v = k.degerler[donem];
    if(v === undefined || v === null) return null;
    if(!oncekiDonem) return v;
    const o = k.degerler[oncekiDonem];
    if(o === undefined || o === null) return null;
    return v - o;
  };
  const al = (adaylar) => {
    for(const ad of adaylar){
      const k = K.find(x => x.ad === ad);
      if(!k) continue;
      const c = ceyrekDegeri(ad);
      return c === null ? null : c * carpan;
    }
    return null;
  };
  const toplamAl = (adaylar) => {
    let t = null;
    adaylar.forEach(ad => {
      const c = ceyrekDegeri(ad);
      if(c !== null){ t = (t || 0) + c * carpan; }
    });
    return t;
  };

  // BANKA formatı desteği: bankalarda "hasılat" yok, karşılığı faiz/toplam
  // faaliyet geliri. Sanayi adları bulunamazsa banka adlarına düşer.
  const hasilat  = al(["Satış Gelirleri","Hasılat","Esas Faaliyet Gelirleri",
                    "VII. TOPLAM FAALİYET GELİRİ/GİDERİ (III+IV+V+VI)","III. NET FAİZ GELİRİ/GİDERİ (I - II)","I. FAİZ GELİRLERİ"]);
  const satMal   = al(["Satışların Maliyeti (-)","Satışların Maliyeti"]);
  const brutKar  = al(["BRÜT KAR (ZARAR)","Ticari Faaliyetlerden Brüt Kar (Zarar)","Brüt Kâr (Zarar)"]);
  const faalGider= toplamAl(["Pazarlama, Satış ve Dağıtım Giderleri (-)","Genel Yönetim Giderleri (-)","Araştırma ve Geliştirme Giderleri (-)"]);
  const faalKar  = al(["FAALİYET KARI (ZARARI)","Net Faaliyet Kar/Zararı","Esas Faaliyet Kârı (Zararı)",
                    "XI. NET FAALİYET KARI/ZARARI","X. NET FAALİYET KARI/ZARARI"]);
  const vergiOnc = al(["SÜRDÜRÜLEN FAALİYETLER VERGİ ÖNCESİ KARI (ZARARI)","Sürdürülen Faaliyetler Vergi Öncesi Karı (Zararı)"]);
  const vergi    = al(["Sürdürülen Faaliyetler Vergi Geliri (Gideri)","Dönem Vergi Geliri (Gideri)"]);
  const netKar   = al(["DÖNEM KARI (ZARARI)","Dönem Net Kar/Zararı","Net Dönem Kârı (Zararı)",
                    "XVIII. NET DÖNEM KARI/ZARARI","XVII. NET DÖNEM KARI/ZARARI"]);

  if(hasilat === null || !hasilat){
    kap.innerHTML = '<div class="gnc-durum-kutu">Bu şirket için gelir akışı çizilemedi — hasılat/gelir kalemi bulunamadı.<br><span style="font-size:10.5px;color:var(--ink-faint);">Bankalar ve sigorta şirketleri farklı tablo formatı kullanır.</span></div>';
    return;
  }

  // BOYUTLAR — DÜZELTME (16 Ağu 2026): Her kutunun ÜSTÜNDE 3 satır yazı var
  // (ad + tutar + marj ≈ 30px) ama kutular arası boşluk 26px'ti -> yazılar
  // birbirinin üstüne biniyordu. Boşluk 48px'e, üst pay 52px'e çıkarıldı.
  const G = 900, Y = 345, ustPay = 52, altPay = 38;
  const cizimY = Y - ustPay - altPay;
  const KUTU_G = 15, BOSLUK = 48;

  // OLCEK: tek bir kutuya gore DEGIL, EN KALABALIK KOLONUN TOPLAMINA gore
  // hesaplanir. Yoksa iki kutulu bir kolon (kutular + aradaki bosluk) cizim
  // alanini asip tasar (16 Agu 2026'da HEKTS verisiyle test edilip yakalandi).
  const kolonGruplari = [
    [hasilat],
    [brutKar, satMal],
    [faalKar, faalGider],
    [vergiOnc],
    [netKar, vergi],
  ];
  let enBuyukKolon = 0;
  kolonGruplari.forEach(grup => {
    const gecerli = grup.filter(v => v !== null);
    const toplam = gecerli.reduce((a,v) => a + Math.abs(v), 0);
    if(toplam > enBuyukKolon) enBuyukKolon = toplam;
  });
  const enCokKutu = Math.max(...kolonGruplari.map(g => g.filter(v => v !== null).length));
  const bosluklarToplam = BOSLUK * Math.max(0, enCokKutu - 1);
  const kullanilabilir = Math.max(40, cizimY - bosluklarToplam);
  const olcek = kullanilabilir / (enBuyukKolon || 1);
  const yuk = v => Math.max(3, Math.abs(v || 0) * olcek);

  const YESIL = "#1D6555", KIRMIZI = "#9B3A2C", MOR = "#3D5A72";
  const renk = v => (v === null || v >= 0) ? YESIL : KIRMIZI;
  const marj = v => (v === null || !hasilat) ? "" : ` · %${(v/hasilat*100).toFixed(1)} marj`;

  // Kolonlar: her biri {x, kutular:[{ad,deger,renk}]}
  const kolonlar = [
    { x: 40,  kutular: [{ad:"Hasılat", deger:hasilat, renk:MOR, marjYok:true}] },
    { x: 235, kutular: [
        {ad:"Brüt Kâr", deger:brutKar, renk:renk(brutKar)},
        {ad:"Satışların Maliyeti", deger:satMal, renk:KIRMIZI},
      ]},
    { x: 430, kutular: [
        {ad:"Faaliyet Kârı", deger:faalKar, renk:renk(faalKar)},
        {ad:"Faaliyet Giderleri", deger:faalGider, renk:KIRMIZI},
      ]},
    { x: 625, kutular: [{ad:"Vergi Öncesi Kâr", deger:vergiOnc, renk:renk(vergiOnc)}] },
    { x: 820, kutular: [
        {ad:"Net Kâr", deger:netKar, renk:renk(netKar)},
        {ad:"Vergi", deger:vergi, renk:renk(vergi)},
      ]},
  ];

  // Her kolondaki kutuları dikey yerleştir (üstten alta, aralarında boşluk)
  kolonlar.forEach(kol => {
    const gecerli = kol.kutular.filter(b => b.deger !== null);
    const toplamY = gecerli.reduce((a,b) => a + yuk(b.deger), 0) + BOSLUK * Math.max(0, gecerli.length - 1);
    let y = ustPay + (cizimY - toplamY) / 2;
    kol.kutular.forEach(b => {
      if(b.deger === null){ b.gizli = true; return; }
      b.y = y; b.h = yuk(b.deger); b.x = kol.x;
      y += b.h + BOSLUK;
    });
  });

  let svg = `<svg width="100%" height="auto" viewBox="0 0 ${G} ${Y}" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;height:auto;" xmlns="http://www.w3.org/2000/svg">`;

  // Akış bantları (kaynak kutunun sağından hedef kutunun soluna, eğri)
  function bant(kaynak, hedef, bRenk){
    if(!kaynak || !hedef || kaynak.gizli || hedef.gizli) return "";
    const x1 = kaynak.x + KUTU_G, x2 = hedef.x;
    const orta = (x1 + x2) / 2;
    const h = Math.min(kaynak.h, hedef.h);
    const y1 = kaynak.y, y2 = hedef.y;
    return `<path d="M ${x1} ${y1} C ${orta} ${y1}, ${orta} ${y2}, ${x2} ${y2}
             L ${x2} ${y2 + h} C ${orta} ${y2 + h}, ${orta} ${y1 + h}, ${x1} ${y1 + h} Z"
             fill="${bRenk}" opacity="0.16"/>`;
  }
  const [k0,k1,k2,k3,k4] = kolonlar;
  svg += bant(k0.kutular[0], k1.kutular[0], YESIL);
  svg += bant(k0.kutular[0], k1.kutular[1], KIRMIZI);
  svg += bant(k1.kutular[0], k2.kutular[0], renk(faalKar));
  svg += bant(k1.kutular[0], k2.kutular[1], KIRMIZI);
  svg += bant(k2.kutular[0], k3.kutular[0], renk(vergiOnc));
  svg += bant(k3.kutular[0], k4.kutular[0], renk(netKar));
  svg += bant(k3.kutular[0], k4.kutular[1], renk(vergi));

  // Kutular + etiketler
  kolonlar.forEach(kol => {
    kol.kutular.forEach(b => {
      if(b.gizli) return;
      svg += `<rect x="${b.x}" y="${b.y.toFixed(1)}" width="${KUTU_G}" height="${b.h.toFixed(1)}" fill="${b.renk}" rx="2"/>`;
      // ETİKET YERLEŞİMİ — DÜZELTME (16 Ağu 2026): Önce ad kutunun üstündeydi
      // ama tutar (+13) ve marj (+25) satırları AŞAĞI doğru gidiyor, yani
      // kutunun İÇİNE giriyordu. Artık üçü de kutunun TAMAMEN ÜSTÜNDE,
      // yukarıdan aşağı: ad → tutar → marj, en alttaki kutuya 8px mesafede.
      const marjVar = !b.marjYok;
      const altSatir = Math.max(30, b.y - 8);              // en alttaki yazı satırı
      const marjY   = altSatir;                             // marj (en alta yakın)
      const tutarY  = marjVar ? altSatir - 12 : altSatir;   // tutar
      const adY     = tutarY - 13;                          // ad (en üstte)
      svg += `<text x="${b.x + KUTU_G/2}" y="${adY.toFixed(1)}" text-anchor="middle" font-size="11" font-weight="600" fill="#141A19">${b.ad}</text>`;
      svg += `<text x="${b.x + KUTU_G/2}" y="${tutarY.toFixed(1)}" text-anchor="middle" font-size="10.5" font-family="IBM Plex Mono,monospace" fill="${b.deger < 0 ? KIRMIZI : '#565F5A'}">${paraKisa(b.deger)} ₺</text>`;
      if(marjVar){
        svg += `<text x="${b.x + KUTU_G/2}" y="${marjY.toFixed(1)}" text-anchor="middle" font-size="9.5" fill="#8D958E">%${(b.deger/hasilat*100).toFixed(1)}</text>`;
      }
    });
  });

  svg += `</svg>`;
  kap.innerHTML = svg;
}

      <button class="sd-alt-sekme ${ALT_SEKME==='gelir'?'aktif':''}" onclick="altSekmeSec('gelir')">Gelir Tablosu</button>

  kap.innerHTML = html;

  pngBtnBagla();

function enflasyonDegis(){ ENFLASYON = !ENFLASYON; sekmeIcerikCiz(); }
function tumKalemleriDegis(){ TUM_KALEMLER = !TUM_KALEMLER; sekmeIcerikCiz(); }
function degisimDegis(){ DEGISIM_GOSTER = !DEGISIM_GOSTER; sekmeIcerikCiz(); }

/* ---------- KARNE ---------- */
/* Fiyatı çeyrek sonlarına hizala: her çeyreğin SON işlem günü kapanışı.
   Enflasyon açıkken fiyat da bugünün lirasına taşınır (Finvest de böyle
   yapıyor - 15 Ağu 2026 ekran görüntüsünde fiyat ekseni 32₺ -> 90₺ oldu). */
function fiyatSerisi(donemler){
  if(!FIYAT || !FIYAT.seri) return donemler.map(() => null);
  const seri = FIYAT.seri.slice().sort((a,b) => a.tarih.localeCompare(b.tarih));
  return donemler.map(d => {
    const [y,q] = d.split("/");
    const sinir = `${y}-${String(q).padStart(2,'0')}-31`;
    let son = null;
    for(const s of seri){ if(s.tarih <= sinir) son = s.kapanis; else break; }
    if(son === null) return null;
    return son * enflasyonCarpani(d);
  });
}

function karneCiz(){
  const kap = document.getElementById("sekme-icerik");
  const K = FIN.kalemler;

  // Dönemler: eskiden yeniye, son 40 çeyrek (10 yıl)
  const donemler = [...new Set(K.flatMap(k => Object.keys(k.degerler)))]
    .sort((a,b) => donemAnahtar(a) - donemAnahtar(b)).slice(-40);
  const etiketler = donemler.map(donemEtiket);

  // --- Kalemler (birden fazla olası ad denenir - kaynak isimlendirmeyi değiştirebilir) ---
  // BANKA/SANAYİ KALEM ADLARI - bankalar BDDK formatında tamamen FARKLI
  // isimler kullanıyor (16 Ağu 2026'da AKBNK'de grafiklerin boş çıkmasıyla
  // tespit edildi). Projenin kendi buyume_hesapla.py / deger_hesapla.py
  // dosyalarında zaten doğrulanmış iki eşleşme vardı, diğerleri standart
  // BDDK tablo başlıklarından eklendi. kalemBul sırayla dener, ilk bulduğunu alır.
  const satis   = kalemBul(K, ["Satış Gelirleri","Hasılat","Esas Faaliyet Gelirleri",
                    "III. NET FAİZ GELİRİ/GİDERİ (I - II)","VII. TOPLAM FAALİYET GELİRİ/GİDERİ (III+IV+V+VI)","I. FAİZ GELİRLERİ"]);
  const netKar  = kalemBul(K, ["Dönem Net Kar/Zararı","Net Dönem Kârı (Zararı)","DÖNEM KARI (ZARARI)",
                    "XVIII. NET DÖNEM KARI/ZARARI","XVII. NET DÖNEM KARI/ZARARI","NET DÖNEM KARI/ZARARI"]);
  const faalKar = kalemBul(K, ["FAALİYET KARI (ZARARI)","Net Faaliyet Kar/Zararı","Esas Faaliyet Kârı (Zararı)",
                    "XI. NET FAALİYET KARI/ZARARI","X. NET FAALİYET KARI/ZARARI"]);
  const amort   = kalemBul(K, ["Amortisman Giderleri","Amortisman & İtfa Payları"]);
  const serbest = kalemBul(K, ["Serbest Nakit Akım"]);
  const opNakit = kalemBul(K, ["İşletme Faaliyetlerinden Kaynaklanan Net Nakit",
                    "I. BANKACILIK FAALİYETLERİNDEN KAYNAKLANAN NET NAKİT AKIŞI"]);
  const ozkaynak= kalemBul(K, ["Özkaynaklar","XVI. ÖZKAYNAKLAR","Ana Ortaklığa Ait Özkaynaklar"]);
  const nakit   = kalemBul(K, ["Nakit ve Nakit Benzerleri","I. NAKİT DEĞERLER VE MERKEZ BANKASI"]);

  // TEŞHİS: hangi kalemler bulunamadı? Grafik sessizce boş kalmasın -
  // kullanıcı NEDEN boş olduğunu görsün, biz de gerçek kalem adını öğrenelim.
  const bulunamayanlar = [];
  [["Satışlar/Gelir",satis],["Net Kâr",netKar],["Faaliyet Kârı",faalKar],
   ["Amortisman",amort],["Serbest Nakit Akım",serbest],["Operasyonel Nakit",opNakit],
   ["Özkaynak",ozkaynak],["Nakit",nakit]].forEach(([ad,k]) => { if(!k) bulunamayanlar.push(ad); });

  // AKIŞ kalemleri (gelir tablosu / nakit akım): KÜMÜLATİF geliyor, önce
  // gerçek çeyrekliğe çevir, SONRA yıllıklandır.
  // DOĞRU SIRA: ham → kümülatiften çeyreğe → enflasyon → yıllıklandır
  const akis = (kalem) => yilliklandir(
    enflasyonUygula(kumulatiftenCeyrege(seriHam(kalem, donemler), donemler), donemler), false);
  // STOK kalemleri (bilanço): kümülatif DEĞİL, doğrudan enflasyon uygulanır.
  const stok = (kalem) => yilliklandir(seriCikar(kalem, donemler), true);

  const sSatis   = akis(satis);
  const sNetKar  = akis(netKar);
  const sSerbest = akis(serbest);
  const sOpNakit = akis(opNakit);
  const sOzkaynak= stok(ozkaynak);
  const sNakit   = stok(nakit);
  const sFiyat   = fiyatSerisi(donemler);

  // FAVÖK = Faaliyet Kârı + Amortisman (standart yaklaşım; kaynakta hazır kalem yok)
  // FAVÖK = Faaliyet Kârı + Amortisman. İkisi de AKIŞ kalemi -> önce
  // kümülatiften çeyrekliğe çevrilir, sonra toplanır, sonra yıllıklandırılır.
  // FAVÖK (EBITDA) — DÜZELTME (16 Ağu 2026):
  // Önce "FAALİYET KARI + Amortisman" kullanıyorduk ama İş Yatırım'ın
  // "FAALİYET KARI (ZARARI)" kalemi DİĞER faaliyet gelir/giderlerini de
  // içeriyor; FAVÖK ise bunları dışlar. AGHOL'de bu yüzden 55,8 Mr çıkıyordu,
  // Finvest 74,6 Mr gösteriyordu (%25 fark), oysa Satışlar ve Net Kâr birebir
  // tutuyordu — yani sorun sadece bu formüldeydi.
  // Standart tanım: FAVÖK = Brüt Kâr − (Pazarlama + Genel Yönetim + Ar-Ge) + Amortisman
  // Bu kalemler bulunamazsa eski yönteme (Faaliyet Kârı + Amortisman) düşer.
  const brutKarK  = kalemBul(K, ["BRÜT KAR (ZARAR)","Ticari Faaliyetlerden Brüt Kar (Zarar)","Brüt Kâr (Zarar)"]);
  const pazarlamaK= kalemBul(K, ["Pazarlama, Satış ve Dağıtım Giderleri (-)","Pazarlama Giderleri (-)"]);
  const genelK    = kalemBul(K, ["Genel Yönetim Giderleri (-)"]);
  const argeK     = kalemBul(K, ["Araştırma ve Geliştirme Giderleri (-)"]);

  // FAVÖK bileşenleri de AKIŞ kalemi: ham → çeyreklik → enflasyon
  const cev = (kalem) => enflasyonUygula(kumulatiftenCeyrege(seriHam(kalem, donemler), donemler), donemler);
  const sBrutKar = cev(brutKarK);
  const sPazarlama = cev(pazarlamaK);
  const sGenel = cev(genelK);
  const sArge = cev(argeK);
  const sFaalKarC = cev(faalKar);
  const sAmortC   = cev(amort);

  const sFavokHam = donemler.map((_, i) => {
    const am = sAmortC[i];
    // Tercih edilen (standart) yöntem
    if(brutKarK && sBrutKar[i] !== null && am !== null){
      // Gider kalemleri kaynakta NEGATİF geliyor (adlarında "(-)" var),
      // bu yüzden ÇIKARMAK yerine TOPLUYORUZ. Eksik olan gider 0 sayılır.
      const giderler = (sPazarlama[i] || 0) + (sGenel[i] || 0) + (sArge[i] || 0);
      return sBrutKar[i] + giderler + am;
    }
    // Yedek: eski yöntem
    if(sFaalKarC[i] !== null && am !== null) return sFaalKarC[i] + am;
    return null;
  });
  const sFavok = yilliklandir(sFavokHam, false);

  const pEk = PERIYOT === "yillik" ? "(Yıllık) " : "";
  const birim = PERIYOT === "yillik" ? "Son 4 çeyrek toplamı" : "Çeyreklik";

  let html = `
    <div class="sd-arac-satir">
      <div class="sd-switch ${ENFLASYON?'acik':''}" onclick="enflasyonDegis()"></div>
      <span style="font-size:12px;">Enflasyon düzeltmesi</span>
      <div class="sd-alt-sekmeler" style="margin:0 0 0 14px;">
        <button class="sd-alt-sekme ${PERIYOT==='yillik'?'aktif':''}" onclick="periyotDegis('yillik')">Yıllık</button>
        <button class="sd-alt-sekme ${PERIYOT==='ceyreklik'?'aktif':''}" onclick="periyotDegis('ceyreklik')">Çeyreklik</button>
      </div>
    </div>
    <div class="sd-switch-not" style="margin:-8px 0 16px;">${ENFLASYON
      ? `Tüm dönemler TÜFE ile ${TUFE_BAZ_DONEM ? donemEtiket(TUFE_BAZ_DONEM) : "en son"} dönemin lirasına taşındı — geçmişle bugün gerçekten karşılaştırılabilir.`
      : "Rakamlar raporlandığı gibi (nominal). 2024 ve sonrası zaten TMS 29 ile düzeltilmiş, öncesi değil."}</div>
    ${bulunamayanlar.length ? `<div style="margin-bottom:14px;padding:10px 12px;background:var(--ochre-soft);border-radius:6px;font-size:11px;color:var(--ink);">
      <b>⚠ ${bulunamayanlar.length} kalem bu şirketin tablosunda bulunamadı:</b> ${bulunamayanlar.join(", ")}.
      İlgili grafikler boş görünecek. Bu genelde bankalar/sigorta gibi farklı tablo formatı kullanan
      şirketlerde olur — kalem adları standart sanayi şirketlerinden farklıdır.
    </div>` : ''}
    <div class="sd-grafik-grid">
      ${grafikKartHtml("k1","Büyüme Trendi: Satışlar ve Kârlılık", birim + ", TL", [
        {tip:"kutu", renk:"#1D6555", ad:pEk+"Satışlar (sol)"},
        {tip:"cizgi", renk:"#A8552A", ad:pEk+"FAVÖK (sağ)"},
        {tip:"cizgi", renk:"#8C6C28", ad:pEk+"Net Kâr (sağ)"},
      ])}
      ${grafikKartHtml("k2","Satışlar ve Hisse Fiyatı", birim + " satış vs. hisse fiyatı (₺)", [
        {tip:"kutu", renk:"#1D6555", ad:pEk+"Satışlar (sol)"},
        {tip:"cizgi", renk:"#823F1C", ad:"Hisse Fiyatı (sağ)"},
      ])}
      ${grafikKartHtml("k3","Nakit Akışı Kalitesi", birim + ", TL", [
        {tip:"kutu", renk:"#7FA88F", ad:pEk+"Serbest Nakit Akışı (sol)"},
        {tip:"cizgi", renk:"#3D5A72", ad:pEk+"Operasyonel Nakit Akışı (sağ)"},
        {tip:"cizgi", renk:"#A8552A", ad:pEk+"Net Kâr (sağ)"},
      ])}
      ${grafikKartHtml("k4","Bilanço Gücü: Özkaynak ve Nakit", "Dönem sonu, TL", [
        {tip:"kutu", renk:"#7FA88F", ad:"Özkaynak (sol)"},
        {tip:"cizgi", renk:"#823F1C", ad:"Nakit ve Benzerleri (sağ)"},
      ])}
    </div>
    ${ozelPanelHtml(K)}
    <div id="ozel-grafikler"></div>
    <div class="sd-veri-zaman" id="karne-veri-zaman"></div>`;
  kap.innerHTML = html;
  veriZamaniYaz("karne-veri-zaman", FIN.guncelleme);

  grafikCiz("g-k1", { etiketler, bar:{ad:"Satışlar", renk:"#1D6555", veriler:sSatis},
    cizgiler:[{ad:"FAVÖK",renk:"#A8552A",veriler:sFavok},{ad:"Net Kâr",renk:"#8C6C28",veriler:sNetKar}], sifirCizgisi:true });
  grafikCiz("g-k2", { etiketler, bar:{ad:"Satışlar", renk:"#1D6555", veriler:sSatis},
    cizgiler:[{ad:"Hisse Fiyatı",renk:"#823F1C",veriler:sFiyat}], sagEksenPara:false });
  grafikCiz("g-k3", { etiketler, bar:{ad:"Serbest Nakit Akışı", renk:"#7FA88F", veriler:sSerbest},
    cizgiler:[{ad:"Operasyonel Nakit",renk:"#3D5A72",veriler:sOpNakit},{ad:"Net Kâr",renk:"#A8552A",veriler:sNetKar}], sifirCizgisi:true });
  grafikCiz("g-k4", { etiketler, bar:{ad:"Özkaynak", renk:"#7FA88F", veriler:sOzkaynak},
    cizgiler:[{ad:"Nakit ve Benzerleri",renk:"#823F1C",veriler:sNakit}] });

  ozelGrafikleriCiz(donemler, etiketler);
  pngBtnBagla();
}

function ozelGrafikleriCiz(donemler, etiketler){
  const kap = document.getElementById("ozel-grafikler");
  if(!kap || !OZEL_GRAFIKLER.length){ if(kap) kap.innerHTML = ""; return; }
  const K = FIN.kalemler;

  let html = `<div class="sd-grafik-grid" style="margin-top:16px;">`;
  OZEL_GRAFIKLER.forEach((o, idx) => {
    const k1 = K[o.k1];
    const ad2 = o.k2 === "fiyat" ? "Hisse Fiyatı" : (K[parseInt(o.k2)]?.ad || "—");
    html += `<div class="gnc-panel-kart">
      <div class="gnc-panel-baslik">
        <div><h2 class="sd-grafik-baslik">${k1?.ad || '—'} <span style="color:var(--ink-faint);font-weight:400;">vs</span> ${ad2}</h2>
          <div class="sd-grafik-alt">${PERIYOT==='yillik'?'Son 4 çeyrek toplamı':'Çeyreklik'}${ENFLASYON?' · enflasyondan arındırılmış':''}</div></div>
        ${pngBtnHtml()}
        <span onclick="ozelSil(${idx})" title="Bu grafiği kaldır" style="cursor:pointer;color:var(--ink-faint);margin-left:8px;font-size:15px;">×</span>
      </div>
      <div class="sd-lejant">
        <span><span class="kutu" style="background:#1D6555"></span>${k1?.ad || '—'} (sol)</span>
        <span><span class="cizgi" style="border-color:#823F1C"></span>${ad2} (sağ)</span>
      </div>
      <div class="sd-grafik-dis" id="g-oz${idx}"></div>
    </div>`;
  });
  html += `</div>`;
  kap.innerHTML = html;

  OZEL_GRAFIKLER.forEach((o, idx) => {
    const k1 = K[o.k1];
    // Bilanço kalemi STOK (kümülatif değil), diğerleri AKIŞ (kümülatif) -
    // akış olanlar önce gerçek çeyrekliğe çevrilir.
    const bilancoMu1 = bolumle(K).bilanco.includes(k1);
    const ham1 = seriHam(k1, donemler);
    const s1 = yilliklandir(bilancoMu1
      ? enflasyonUygula(ham1, donemler)
      : enflasyonUygula(kumulatiftenCeyrege(ham1, donemler), donemler), bilancoMu1);
    let s2, ad2, paraMi = true;
    if(o.k2 === "fiyat"){
      s2 = fiyatSerisi(donemler); ad2 = "Hisse Fiyatı"; paraMi = false;
    } else {
      const k2 = K[parseInt(o.k2)];
      const bilancoMu2 = bolumle(K).bilanco.includes(k2);
      const ham2 = seriHam(k2, donemler);
      s2 = yilliklandir(bilancoMu2
        ? enflasyonUygula(ham2, donemler)
        : enflasyonUygula(kumulatiftenCeyrege(ham2, donemler), donemler), bilancoMu2);
      ad2 = k2?.ad || "—";
    }
    grafikCiz(`g-oz${idx}`, { etiketler, bar:{ad:k1?.ad||"—", renk:"#1D6555", veriler:s1},
      cizgiler:[{ad:ad2, renk:"#823F1C", veriler:s2}], sifirCizgisi:true, sagEksenPara:paraMi });
  });
  pngBtnBagla();
}


/* ============================================================
   MEVSİMSELLİK — aylık getiri ısı haritası
   Yöntem (Finvest'in AGHOL verisiyle DOĞRULANDI, 16 Ağu 2026):
     aylık getiri = (ayın son kapanışı / önceki ayın son kapanışı) − 1
     yıllık toplam = ayların BİLEŞİĞİ (çarpımı), toplamı DEĞİL
   Test: 2024 için 57,09% ve 2023 için 83,71% çıktı — Finvest'in
   gösterdiğiyle sıfır sapma.
   Enflasyon düğmesi açıkken REEL getiri gösterilir (nominal getiriden o
   ayın TÜFE artışı arındırılır) — bu GNC'nin "reel getiri" yaklaşımı.
   ============================================================ */
function aylikGetiriler(){
  if(!FIYAT || !FIYAT.seri || !FIYAT.seri.length) return null;
  const seri = FIYAT.seri.slice().sort((a,b) => a.tarih.localeCompare(b.tarih));
  // Her ayın SON kapanışı
  const aySon = {};
  seri.forEach(s => {
    if(!s.tarih || s.kapanis === null || s.kapanis === undefined) return;
    aySon[s.tarih.slice(0,7)] = s.kapanis;   // "YYYY-MM"
  });
  const aylar = Object.keys(aySon).sort();
  if(aylar.length < 2) return null;

  const getiri = {};   // "YYYY-MM" -> yüzde
  for(let i = 1; i < aylar.length; i++){
    const oncekiAy = aylar[i-1], buAy = aylar[i];
    // Ay atlanmışsa (veri boşluğu) hesaplama - yanıltıcı olur
    const [y1,m1] = oncekiAy.split("-").map(Number);
    const [y2,m2] = buAy.split("-").map(Number);
    if((y2*12+m2) - (y1*12+m1) !== 1) continue;

    const onceki = aySon[oncekiAy], simdi = aySon[buAy];
    if(!onceki || !simdi) continue;
    let g = (simdi / onceki - 1) * 100;

    if(ENFLASYON){
      // REEL getiri: nominal getiriden o ayın enflasyonu arındırılır
      // (1+nominal)/(1+enflasyon) − 1
      const t1 = TUFE_AYLIK[oncekiAy], t2 = TUFE_AYLIK[buAy];
      if(t1 && t2){
        const enf = t2 / t1 - 1;
        g = ((1 + g/100) / (1 + enf) - 1) * 100;
      } else {
        continue;  // TÜFE yoksa REEL getiri hesaplanamaz - uydurma yapmıyoruz
      }
    }
    getiri[buAy] = g;
  }
  return getiri;
}

function mevsimsellikCiz(){
  const kap = document.getElementById("sekme-icerik");
  const getiri = aylikGetiriler();

  if(!getiri || !Object.keys(getiri).length){
    kap.innerHTML = `<div class="sd-arac-satir">
        <div class="sd-switch ${ENFLASYON?'acik':''}" onclick="enflasyonDegis()"></div>
        <span style="font-size:12px;">Enflasyon düzeltmesi</span>
      </div>
      <div class="gnc-durum-kutu">${ENFLASYON
        ? "Reel getiri için aylık TÜFE verisi gerekiyor ama bulunamadı. Enflasyon düzeltmesini kapatarak nominal getirileri görebilirsin."
        : "Bu şirket için yeterli fiyat geçmişi bulunamadı."}</div>`;
    return;
  }

  const yillar = [...new Set(Object.keys(getiri).map(a => a.slice(0,4)))].sort().reverse();
  const AY_ADLARI = ["OCA","ŞUB","MAR","NİS","MAY","HAZ","TEM","AĞU","EYL","EKİ","KAS","ARA"];

  function renk(g){
    if(g === null || g === undefined) return { bg:"var(--surface)", tx:"var(--ink-faint)" };
    if(g >= 25)  return { bg:"#124B3F", tx:"#fff" };
    if(g >= 10)  return { bg:"#1D6555", tx:"#fff" };
    if(g >= 2)   return { bg:"#CDDCD3", tx:"#141A19" };
    if(g > -2)   return { bg:"#EEF1EC", tx:"#565F5A" };
    if(g > -10)  return { bg:"#E7D2CC", tx:"#141A19" };
    if(g > -25)  return { bg:"#C4695A", tx:"#fff" };
    return { bg:"#9B3A2C", tx:"#fff" };
  }

  let html = `
    <div class="sd-arac-satir">
      <div class="sd-switch ${ENFLASYON?'acik':''}" onclick="enflasyonDegis()"></div>
      <span style="font-size:12px;">Enflasyon düzeltmesi</span>
      <span class="sd-switch-not">${ENFLASYON
        ? "REEL getiri — her aydan o ayın enflasyonu arındırıldı. Paranın alım gücü cinsinden gerçek kazanç/kayıp."
        : "NOMİNAL getiri — fiyat değişimi, enflasyon arındırılmadı."}</span>
    </div>
    <div class="gnc-panel-kart">
      <div class="gnc-panel-baslik">
        <div><h2 class="sd-grafik-baslik"><i class="bi bi-calendar3"></i> Aylık Getiri Performansı (${AKTIF_KOD})</h2>
          <div class="sd-grafik-alt">${yillar.length} yıllık periyodik getiri haritası · ${ENFLASYON ? 'reel (TÜFE\'den arındırılmış)' : 'nominal'} · ₺</div></div>
        ${pngBtnHtml()}
      </div>
      <div style="overflow-x:auto;-webkit-overflow-scrolling:touch;">
      <table class="mv-tablo"><thead><tr><th class="yil">YIL</th>`;
  AY_ADLARI.forEach(a => html += `<th>${a}</th>`);
  html += `<th class="toplam">TOPLAM</th></tr></thead><tbody>`;

  yillar.forEach(yil => {
    html += `<tr><td class="yil">${yil}</td>`;
    let carpim = 1, veriVar = false;
    for(let ay = 1; ay <= 12; ay++){
      const anahtar = `${yil}-${String(ay).padStart(2,'0')}`;
      const g = getiri[anahtar];
      if(g === undefined){
        html += `<td class="bos">—</td>`;
      } else {
        const r = renk(g);
        html += `<td style="background:${r.bg};color:${r.tx};">${g >= 0 ? '+' : ''}${g.toFixed(2)}%</td>`;
        carpim *= (1 + g/100);
        veriVar = true;
      }
    }
    // Yıllık toplam = ayların BİLEŞİĞİ (Finvest ile doğrulandı)
    if(veriVar){
      const yillik = (carpim - 1) * 100;
      const r = renk(yillik);
      html += `<td class="toplam" style="background:${r.bg};color:${r.tx};">${yillik >= 0 ? '+' : ''}${yillik.toFixed(2)}%</td>`;
    } else {
      html += `<td class="toplam bos">—</td>`;
    }
    html += `</tr>`;
  });

  html += `</tbody></table></div>
    <div class="gnc-spk-not">Aylık getiri = ayın son kapanışının bir önceki ayın son kapanışına oranı. Yıllık toplam, ayların bileşik (çarpım) sonucudur. Eksik aylar hesaba katılmaz. Geçmiş performans gelecek için gösterge değildir; eğitim ve araştırma amaçlıdır.</div>
    <div class="sd-veri-zaman" id="mv-veri-zaman"></div>
    </div>`;
  kap.innerHTML = html;
  veriZamaniYaz("mv-veri-zaman", FIYAT && FIYAT.guncelleme);
  pngBtnBagla();
}

/* ---------- PNG İNDİRME ---------- */
function pngBtnHtml(){
  return `<span class="gnc-png-indir" title="PNG olarak indir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></span>`;
}
function pngBtnBagla(){
  document.querySelectorAll(".gnc-png-indir").forEach(btn => {
    if(btn.dataset.bagli) return;
    btn.dataset.bagli = "1";
    btn.addEventListener("click", async () => {
      const kart = btn.closest(".gnc-panel-kart");
      if(!kart || btn.classList.contains("yukleniyor")) return;
      btn.classList.add("yukleniyor");
      // Mobilde PNG "yarım" kalmasın diye render anında masaüstü genişliğine
      // zorluyoruz, sonra eski haline döndürüyoruz (finally ile garanti).
      const MASAUSTU = 1100;
      const mobilMi = window.innerWidth < MASAUSTU;
      const eski = { w:kart.style.width, mw:kart.style.minWidth, mx:kart.style.maxWidth };
      try {
        if(mobilMi){ kart.style.width = MASAUSTU+"px"; kart.style.minWidth = MASAUSTU+"px"; kart.style.maxWidth = "none"; }
        const canvas = await html2canvas(kart, { backgroundColor:"#F8FAF6", scale:2,
          windowWidth: mobilMi ? MASAUSTU : undefined, width: mobilMi ? MASAUSTU : undefined });
        canvas.toBlob(blob => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          const bas = (kart.querySelector("h2")?.textContent || "grafik").trim()
            .toLocaleLowerCase("tr-TR").replace(/[^a-z0-9ğüşıöç]+/gi,"-");
          a.href = url;
          a.download = `gnc-insight-${AKTIF_KOD||'sirketler'}-${bas}-${new Date().toISOString().slice(0,10)}.png`;
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          URL.revokeObjectURL(url);
        });
      } catch(e){
        console.error("PNG indirme hatası:", e);
        alert("PNG indirilemedi, tekrar dener misin?");
      } finally {
        if(mobilMi){ kart.style.width = eski.w; kart.style.minWidth = eski.mw; kart.style.maxWidth = eski.mx; }
        btn.classList.remove("yukleniyor");
      }
    });
  });
}

async function baslat(){
  gncSidebarOlustur("sirketler", "sidebar");
  const [liste, tufe] = await Promise.all([
    gncVeriCek("sirket_listesi.json"),
    gncVeriCek("tufe_ceyreklik.json"),
  ]);
  SIRKETLER = (liste && liste.sirketler) || [];
  LISTE_GUNCELLEME = liste && liste.guncelleme;
  TUFE = (tufe && tufe.endeksler) || {};
  TUFE_AYLIK = (tufe && tufe.aylik) || {};

  if(TUFE["_guncel_ay"]){
    document.getElementById("ust-donem").textContent = "TÜFE bazı: " + TUFE["_guncel_ay"];
  }
  if(!SIRKETLER.length){
    document.getElementById("liste-gorunum").innerHTML =
      '<div class="gnc-durum-kutu">Şirket listesi henüz yok. sirket_listesi_hazirla.py çalıştırılmalı.</div>';
    return;
  }

  const kod = new URLSearchParams(window.location.search).get("kod");
  if(kod){ AKTIF_KOD = kod.toUpperCase(); detayYukle(); }
  else listeCiz();
}

window.addEventListener("popstate", () => {
  const kod = new URLSearchParams(window.location.search).get("kod");
